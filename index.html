  // ---- Pin prescriptions. Non-fallback pins carry their plain group's RANK:
  // y = y0 - cum[rank]. Fallback pins carry rank -1 (legacy y = y0 + off*dy).
  const pinMap = new Map();
  const addPin = (v, off, rank) => {
    if (!pinMap.has(v)) pinMap.set(v, { v, x0: vc[v][0], y0: vc[v][1], off, rank });
  };
  faces.forEach((f, fi) => {
    if (!texFaces[fi] && !compliance[fi]) f.forEach(v => addPin(v, -faceRank[fi], faceRank[fi]));
  });
  // Plain/textured boundary vertices: prescribed with the adjacent plain group's
  // rank (covers compliant plain faces too, whose interiors stay free). In v3
  // this catches every TUBox top/bottom vertex (V and F edges alike), which is
  // the entire canvas attachment of each TU island.
  edgesV.forEach(e => {
    const fs = edgeFaces.get(engEdgeKey(e[0], e[1]));
    if (fs && fs.length === 2 && (texFaces[fs[0]] !== texFaces[fs[1]])) {
      const plainF = texFaces[fs[0]] ? fs[1] : fs[0];
      if (faceRank[plainF] >= 0) {
        addPin(e[0], -faceRank[plainF], faceRank[plainF]);
        addPin(e[1], -faceRank[plainF], faceRank[plainF]);
      }
    }
  });

  const texVerts = new Set();
  faces.forEach((f, fi) => { if (texFaces[fi]) f.forEach(v => texVerts.add(v)); });
  let yMin = Infinity, yMax = -Infinity;
  texVerts.forEach(v => { yMin = Math.min(yMin, vc[v][1]); yMax = Math.max(yMax, vc[v][1]); });
  const span = yMax - yMin;

  // ---- Fallbacks when the group structure can't drive anything. ----
  let fallback = false;
  let gMin = Infinity, gMax = -Infinity;
  vc.forEach(p => { gMin = Math.min(gMin, p[1]); gMax = Math.max(gMax, p[1]); });
  if (numGroups === 0) {
    // No plain faces: fix the global y-min edge, drive the y-max edge down.
    fallback = true;
    vc.forEach((p, v) => {
      if (Math.abs(p[1] - gMin) < 1e-6) addPin(v, 0, -1);
      else if (Math.abs(p[1] - gMax) < 1e-6) addPin(v, -1, -1);
    });
    minGap = gMax - gMin;
  } else if (numGroups === 1) {
    // Single plain group: it is fixed (rank 0); drive the far y-extreme toward it.
    fallback = true;
    const g = plainGroups[0];
    const farIsMax = (g.yMin + g.yMax) / 2 <= (gMin + gMax) / 2;
    vc.forEach((p, v) => {
      if (Math.abs(p[1] - (farIsMax ? gMax : gMin)) < 1e-6) addPin(v, farIsMax ? -1 : 1, -1);
    });
    minGap = gMax - gMin;
  }
  if (!isFinite(minGap) || minGap <= 0)
    minGap = span > 0 ? span / Math.max(1, numGroups - 1) : (gMax - gMin) || 1;

  // Per-TR drive requires a real gap structure and masks that fit in 31 bits.
  const perTRCapable = !fallback && numGaps > 0 && numGaps <= 31;

  const pins = [...pinMap.values()];
  let maxAbsOff = 1;
  pins.forEach(d => { maxAbsOff = Math.max(maxAbsOff, Math.abs(d.off)); });

  let bb = [Infinity,Infinity,-Infinity,-Infinity];
  vc.forEach(p => { bb[0]=Math.min(bb[0],p[0]); bb[1]=Math.min(bb[1],p[1]); bb[2]=Math.max(bb[2],p[0]); bb[3]=Math.max(bb[3],p[1]); });
  const scale = Math.hypot(bb[2]-bb[0], bb[3]-bb[1]);
  const center = [(bb[0]+bb[2])/2, (bb[1]+bb[3])/2, 0];

  const rest = new Float64Array(nv * 3);
  vc.forEach((p, i) => { rest[i*3]=p[0]; rest[i*3+1]=p[1]; rest[i*3+2]=p[2]; });

  const groundedList = [], freeVerts = [];
  for (let v = 0; v < nv; v++) (grounded[v] ? groundedList : freeVerts).push(v);

  return {
    nv, rest, pos: Float64Array.from(rest),
    tris, triFace, texFaces, texRegion, regionIds, texInferred, fallback,
    compliance, numCompliant,
    edgesV, assign, facetEdges,
    stiffCons, softCons, texStrainCons, panels, creases,
    grounded, groundedList, freeVerts,
    pins, numGroups, minGap, maxAbsOff, span, scale, center,
    gaps, numGaps, perTRCapable, faceGapMask, vertGapMask, trGaps, trList,
    cEdges, cEdgeGapMask,
    diagPenGaps: new Float64Array(Math.max(1, numGaps)),
    diagStrainGaps: new Float64Array(Math.max(1, numGaps)),
    // Frozen-vertex state for inactive TRs (rebuilt per bake).
    frozenList: [], frozenFlag: new Uint8Array(nv),
    pinned: new Uint8Array(nv), thick: 0, contactCS: 1,
    contactExcl: null, eeExcl: null, iterPrev: null
  };
}

/* ---- Rigid-body shape matching ---- */
function quatToMat(q, R) {
  const x=q[0], y=q[1], z=q[2], w=q[3];
  const x2=x+x, y2=y+y, z2=z+z;
  const xx=x*x2, yy=y*y2, zz=z*z2, xy=x*y2, xz=x*z2, yz=y*z2, wx=w*x2, wy=w*y2, wz=w*z2;
  R[0]=1-(yy+zz); R[1]=xy-wz;     R[2]=xz+wy;
  R[3]=xy+wz;     R[4]=1-(xx+zz); R[5]=yz-wx;
  R[6]=xz-wy;     R[7]=yz+wx;     R[8]=1-(xx+yy);
}

function extractRotation(A, q, R, maxIter) {
  for (let it = 0; it < maxIter; it++) {
    quatToMat(q, R);
    let ox=0, oy=0, oz=0, d=0;
    for (let c = 0; c < 3; c++) {
      const rx=R[c], ry=R[3+c], rz=R[6+c];
      const ax=A[c], ay=A[3+c], az=A[6+c];
      ox += ry*az - rz*ay; oy += rz*ax - rx*az; oz += rx*ay - ry*ax;
      d  += rx*ax + ry*ay + rz*az;
    }
    const inv = 1 / (Math.abs(d) + 1e-9);
    ox *= inv; oy *= inv; oz *= inv;
    const w = Math.sqrt(ox*ox + oy*oy + oz*oz);
    if (w < 1e-9) break;
    const half = 0.5 * w, s = Math.sin(half) / w, cw = Math.cos(half);
    const qx = ox*s, qy = oy*s, qz = oz*s, qw = cw;
    const nx = qw*q[0] + qx*q[3] + qy*q[2] - qz*q[1];
    const ny = qw*q[1] - qx*q[2] + qy*q[3] + qz*q[0];
    const nz = qw*q[2] + qx*q[1] - qy*q[0] + qz*q[3];
    const nw = qw*q[3] - qx*q[0] - qy*q[1] - qz*q[2];
    const len = Math.hypot(nx, ny, nz, nw) || 1;
    q[0]=nx/len; q[1]=ny/len; q[2]=nz/len; q[3]=nw/len;
  }
  quatToMat(q, R);
}

function projectPanelRigid(p, panel) {
  const vs = panel.verts, n = vs.length, q0 = panel.q, A = panel.A, R = panel.R;
  let cx = 0, cy = 0, cz = 0;
  for (let k = 0; k < n; k++) { const o = vs[k]*3; cx += p[o]; cy += p[o+1]; cz += p[o+2]; }
  cx /= n; cy /= n; cz /= n;
  A.fill(0);
  for (let k = 0; k < n; k++) {
    const o = vs[k]*3;
    const px = p[o]-cx, py = p[o+1]-cy, pz = p[o+2]-cz;
    const qx = q0[k*3], qy = q0[k*3+1], qz = q0[k*3+2];
    A[0]+=px*qx; A[1]+=px*qy; A[2]+=px*qz;
    A[3]+=py*qx; A[4]+=py*qy; A[5]+=py*qz;
    A[6]+=pz*qx; A[7]+=pz*qy; A[8]+=pz*qz;
  }
  extractRotation(A, panel.quat, R, panel.warm ? 4 : 16);
  panel.warm = true;
  for (let k = 0; k < n; k++) {
    const o = vs[k]*3;
    const qx = q0[k*3], qy = q0[k*3+1], qz = q0[k*3+2];
    p[o]   = R[0]*qx + R[1]*qy + R[2]*qz + cx;
    p[o+1] = R[3]*qx + R[4]*qy + R[5]*qz + cy;
    p[o+2] = R[6]*qx + R[7]*qy + R[8]*qz + cz;
  }
}

/* ---- PBD solver primitives ---- */
function projectDist(p, i, j, r, k) {
  const ix = i*3, jx = j*3;
  const dx = p[jx]-p[ix], dy = p[jx+1]-p[ix+1], dz = p[jx+2]-p[ix+2];
  const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (d < 1e-9) return;
  const f = 0.5 * k * (d - r) / d;
  p[ix] += dx*f; p[ix+1] += dy*f; p[ix+2] += dz*f;
  p[jx] -= dx*f; p[jx+1] -= dy*f; p[jx+2] -= dz*f;
}

// ============================================================
// XPBD MODULE — self-contained, delete-safe
// Soft constraints no longer use a projection stiffness factor;
// instead each carries a compliance `alpha` and a Lagrange
// multiplier `lam`. The converged result is independent of the
// iteration count: elongation reflects a true force balance,
// rather than converging toward rigidity.
// ============================================================
const XPBD = {
  // Global compliance scale. Tuned for KnitTex: ALPHA_UNIT = 100 with
  // softK = 0.4 (alpha = 150). NOTE: at this scale, softK < ~0.1 is
  // effectively free elongation; the usable range is ~0.2–0.9.
  ALPHA_UNIT: 100,

  // Map a 0..1 stiffness knob to a compliance alpha:
  // k = 1  -> alpha = 0 (fully rigid; behaves like a hard constraint)
  // k -> 0 -> alpha very large (barely resists elongation)
  kToAlpha(k) {
    const kk = Math.min(Math.max(k, 1e-4), 1.0);
    return (1 / kk - 1) * XPBD.ALPHA_UNIT;
  },

  // XPBD distance-constraint projection (adapted to this engine).
  // con carries { i, j, r, alpha, lam }.
  // Weights: pinned/frozen vertices get 0 (m.pinned is filled by
  // computeSweep when contacts are on); when m.pinned is unfilled all
  // weights are 1, matching the symmetric behavior of projectDist.
  projectDist(m, p, con) {
    const i3 = con.i * 3, j3 = con.j * 3;
    let dx = p[j3]     - p[i3],
        dy = p[j3 + 1] - p[i3 + 1],
        dz = p[j3 + 2] - p[i3 + 2];
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (len < 1e-9) return;
    const wi = m.pinned[con.i] ? 0 : 1, wj = m.pinned[con.j] ? 0 : 1;
    const wSum = wi + wj;
    if (wSum === 0) return;
    const C = len - con.r;
    // XPBD core formula: dλ = (−C − α·λ) / (Σw + α)
    const dLam = (-C - con.alpha * con.lam) / (wSum + con.alpha);
    con.lam += dLam;
    const s = dLam / len;
    dx *= s; dy *= s; dz *= s;
    p[i3]     -= wi * dx; p[i3 + 1] -= wi * dy; p[i3 + 2] -= wi * dz;
    p[j3]     += wj * dx; p[j3 + 1] += wj * dy; p[j3 + 2] += wj * dz;
  },

  // λ must be reset to zero at the start of every keyframe
  // (quasi-static sweep; no warm starting across frames).
  resetLambdas(cons) {
    for (let n = 0; n < cons.length; n++) cons[n].lam = 0;
  },

  // Optional: read the current constraint-force magnitude carried by a
  // soft constraint (|λ| is a measure of the force) — available if jam
  // detection ever wants to upgrade to it; no side effects if unused.
  forceOf(con) { return Math.abs(con.lam); }
};

function applyCreaseCouple(m, p, amount) {
  const ff = m.frozenFlag;
  for (const c of m.creases) {
    for (const w of c.wings)
      if (!m.grounded[w] && !ff[w]) p[w*3+2] += c.dir * amount;
    if (!m.grounded[c.u] && !ff[c.u]) p[c.u*3+2] -= c.dir * amount;
    if (!m.grounded[c.v] && !ff[c.v]) p[c.v*3+2] -= c.dir * amount;
  }
}

/* Pins with a valid rank follow the per-gap cumulative drive:
 *   y = y0 - cum[rank], cum[r] = sum of closures of all gaps below rank r
 * (rank 0 => cum = 0 => fixed bottom). Fallback pins (rank -1) use the legacy
 * uniform form y = y0 + off*dy.
 * Frozen vertices (inactive-TR-only) are then prescribed rigidly: flat rest
 * shape translated by the cumulative closure below their gap — physically they
 * are pulled taut by the unmoved plain groups on either side of them. */
function applyPins(m, p, drive) {
  const cum = drive.cum, dy = drive.dy;
  for (const d of m.pins) {
    const o = d.v*3;
    p[o] = d.x0;
    p[o+1] = d.y0 + (d.rank >= 0 ? -cum[d.rank] : d.off * dy);
    p[o+2] = 0;
  }
  for (const d of m.frozenList) {
    const o = d.v*3;
    p[o] = d.x0;
    p[o+1] = d.y0 - cum[d.rank];
    p[o+2] = d.z0;
  }
}

/* Solid ground: one-sided inequality constraint z >= 0. */
function projectGround(m, p) {
  const n = m.nv;
  for (let v = 0; v < n; v++) {
    const o = v*3 + 2;
    if (p[o] < 0) p[o] = 0;
  }
}

/* Anti-tunneling motion clamp: no free vertex may move more than maxStep in a
 * single iteration (measured against the iteration-start snapshot). With the
 * contact pass running afterward every iteration at radius h > maxStep, no
 * vertex can step over the contact shell — faces become impassable like the
 * ground plane, without restricting where they can go (z may be negative). */
function clampStep(m, p, maxStep) {
  const q = m.iterPrev, pin = m.pinned, ms2 = maxStep * maxStep, n = m.nv;
  for (let v = 0; v < n; v++) {
    if (pin[v]) continue;
    const o = v*3;
    const dx = p[o]-q[o], dy = p[o+1]-q[o+1], dz = p[o+2]-q[o+2];
    const d2 = dx*dx + dy*dy + dz*dz;
    if (d2 > ms2) {
      const f = maxStep / Math.sqrt(d2);
      p[o] = q[o] + dx*f; p[o+1] = q[o+1] + dy*f; p[o+2] = q[o+2] + dz*f;
    }
  }
}

/* ---- Self-collision ----
 * Two complementary proximity tests make the contact shell watertight:
 *   1. vertex–triangle (VT): catches face-interior approaches;
 *   2. edge–edge (EE): catches crossing sheets whose closest features are two
 *      edges (the case VT alone misses, letting faces slip through).
 * Spatial hash: primitives binned by bbox (expanded by the search radius) into
 * a uniform grid. */
const cHash = new Map();
const eHash = new Map();
const eeSeen = new Set();
function hashKey(ix, iy, iz) { return ((ix * 92837111) ^ (iy * 689287499) ^ (iz * 283923481)) | 0; }

function binTriangles(m, p, pad) {
  const cs = m.contactCS, tris = m.tris;
  cHash.clear();
  for (let ti = 0; ti < tris.length; ti++) {
    const t = tris[ti];
    const a = t[0]*3, b = t[1]*3, c = t[2]*3;
    const x0 = Math.floor((Math.min(p[a],   p[b],   p[c])   - pad) / cs);
    const x1 = Math.floor((Math.max(p[a],   p[b],   p[c])   + pad) / cs);
    const y0 = Math.floor((Math.min(p[a+1], p[b+1], p[c+1]) - pad) / cs);
    const y1 = Math.floor((Math.max(p[a+1], p[b+1], p[c+1]) + pad) / cs);
    const z0 = Math.floor((Math.min(p[a+2], p[b+2], p[c+2]) - pad) / cs);
    const z1 = Math.floor((Math.max(p[a+2], p[b+2], p[c+2]) + pad) / cs);
    for (let ix = x0; ix <= x1; ix++)
      for (let iy = y0; iy <= y1; iy++)
        for (let iz = z0; iz <= z1; iz++) {
          const k = hashKey(ix, iy, iz);
          let l = cHash.get(k);
          if (!l) cHash.set(k, l = []);
          l.push(ti);
        }
  }
}

function binEdges(m, p, pad) {
  const cs = m.contactCS, E = m.cEdges;
  eHash.clear();
  for (let ei = 0; ei < E.length; ei++) {
    const a = E[ei][0]*3, b = E[ei][1]*3;
    const x0 = Math.floor((Math.min(p[a],   p[b])   - pad) / cs);
    const x1 = Math.floor((Math.max(p[a],   p[b])   + pad) / cs);
    const y0 = Math.floor((Math.min(p[a+1], p[b+1]) - pad) / cs);
    const y1 = Math.floor((Math.max(p[a+1], p[b+1]) + pad) / cs);
    const z0 = Math.floor((Math.min(p[a+2], p[b+2]) - pad) / cs);
    const z1 = Math.floor((Math.max(p[a+2], p[b+2]) + pad) / cs);
    for (let ix = x0; ix <= x1; ix++)
      for (let iy = y0; iy <= y1; iy++)
        for (let iz = z0; iz <= z1; iz++) {
          const k = hashKey(ix, iy, iz);
          let l = eHash.get(k);
          if (!l) eHash.set(k, l = []);
          l.push(ei);
        }
  }
}

/* Closest point on triangle (Ericson). Fills cpt = [qx,qy,qz, u,v,w] (barycentric). */
const cpt = new Float64Array(6);
function closestOnTri(px,py,pz, ax,ay,az, bx,by,bz, cx,cy,cz) {
  const abx=bx-ax, aby=by-ay, abz=bz-az;
  const acx=cx-ax, acy=cy-ay, acz=cz-az;
  const apx=px-ax, apy=py-ay, apz=pz-az;
  const d1 = abx*apx+aby*apy+abz*apz;
  const d2 = acx*apx+acy*apy+acz*apz;
  if (d1 <= 0 && d2 <= 0) { cpt[0]=ax;cpt[1]=ay;cpt[2]=az;cpt[3]=1;cpt[4]=0;cpt[5]=0; return; }
  const bpx=px-bx, bpy=py-by, bpz=pz-bz;
  const d3 = abx*bpx+aby*bpy+abz*bpz;
  const d4 = acx*bpx+acy*bpy+acz*bpz;
  if (d3 >= 0 && d4 <= d3) { cpt[0]=bx;cpt[1]=by;cpt[2]=bz;cpt[3]=0;cpt[4]=1;cpt[5]=0; return; }
  const vc = d1*d4 - d3*d2;
  if (vc <= 0 && d1 >= 0 && d3 <= 0) {
    const t = d1 / (d1 - d3);
    cpt[0]=ax+t*abx; cpt[1]=ay+t*aby; cpt[2]=az+t*abz; cpt[3]=1-t; cpt[4]=t; cpt[5]=0; return;
  }
  const cpx=px-cx, cpy=py-cy, cpz=pz-cz;
  const d5 = abx*cpx+aby*cpy+abz*cpz;
  const d6 = acx*cpx+acy*cpy+acz*cpz;
  if (d6 >= 0 && d5 <= d6) { cpt[0]=cx;cpt[1]=cy;cpt[2]=cz;cpt[3]=0;cpt[4]=0;cpt[5]=1; return; }
  const vb = d5*d2 - d1*d6;
  if (vb <= 0 && d2 >= 0 && d6 <= 0) {
    const t = d2 / (d2 - d6);
    cpt[0]=ax+t*acx; cpt[1]=ay+t*acy; cpt[2]=az+t*acz; cpt[3]=1-t; cpt[4]=0; cpt[5]=t; return;
  }
  const va = d3*d6 - d5*d4;
  if (va <= 0 && (d4-d3) >= 0 && (d5-d6) >= 0) {
    const t = (d4-d3) / ((d4-d3) + (d5-d6));
    cpt[0]=bx+t*(cx-bx); cpt[1]=by+t*(cy-by); cpt[2]=bz+t*(cz-bz); cpt[3]=0; cpt[4]=1-t; cpt[5]=t; return;
  }
  const den = 1 / (va + vb + vc);
  const v = vb*den, w = vc*den;
  cpt[0]=ax+abx*v+acx*w; cpt[1]=ay+aby*v+acy*w; cpt[2]=az+abz*v+acz*w; cpt[3]=1-v-w; cpt[4]=v; cpt[5]=w;
}

/* Closest points between two segments (Ericson 5.1.9). Fills eeRes = [s, t]. */
const eeRes = new Float64Array(2);
function closestSegSeg(p1x,p1y,p1z, q1x,q1y,q1z, p2x,p2y,p2z, q2x,q2y,q2z) {
  const d1x=q1x-p1x, d1y=q1y-p1y, d1z=q1z-p1z;
  const d2x=q2x-p2x, d2y=q2y-p2y, d2z=q2z-p2z;
  const rx=p1x-p2x, ry=p1y-p2y, rz=p1z-p2z;
  const a = d1x*d1x+d1y*d1y+d1z*d1z;
  const e = d2x*d2x+d2y*d2y+d2z*d2z;
  const f = d2x*rx+d2y*ry+d2z*rz;
  let s, t;
  if (a <= 1e-12 && e <= 1e-12) { s = 0; t = 0; }
  else if (a <= 1e-12) { s = 0; t = Math.min(1, Math.max(0, f / e)); }
  else {
    const c = d1x*rx+d1y*ry+d1z*rz;
    if (e <= 1e-12) { t = 0; s = Math.min(1, Math.max(0, -c / a)); }
    else {
      const b = d1x*d2x+d1y*d2y+d1z*d2z;
      const denom = a*e - b*b;
      s = denom > 1e-12 ? Math.min(1, Math.max(0, (b*f - c*e) / denom)) : 0;
      t = (b*s + f) / e;
      if (t < 0) { t = 0; s = Math.min(1, Math.max(0, -c / a)); }
      else if (t > 1) { t = 1; s = Math.min(1, Math.max(0, (b - c) / a)); }
    }
  }
  eeRes[0] = s; eeRes[1] = t;
}

/* Rest-distance exclusion: pairs already within exclR in the flat rest state are
 * permanently excluded — this covers shared-vertex, same-face, and cross-crease
 * neighbor pairs (so folds can close fully), and same-panel pairs are implicitly
 * safe because shape matching preserves rigid distances exactly. */
function buildContactData(m, h) {
  let avg = 0, cnt = 0;
  for (const c of m.stiffCons) { avg += c.r; cnt++; }
  for (const c of m.softCons)  { avg += c.r; cnt++; }
  avg = cnt ? avg / cnt : m.scale * 0.05;
  m.contactCS = Math.max(2.2 * h, avg);
  const exclR = 1.2 * h, exclR2 = exclR * exclR;

  /* --- VT exclusion --- */
  binTriangles(m, m.rest, exclR);
  const ex = new Set();
  const nT = m.tris.length, p = m.rest, cs = m.contactCS;
  for (let v = 0; v < m.nv; v++) {
    const vo = v*3, px = p[vo], py = p[vo+1], pz = p[vo+2];
    const list = cHash.get(hashKey(Math.floor(px/cs), Math.floor(py/cs), Math.floor(pz/cs)));
    if (!list) continue;
    for (let li = 0; li < list.length; li++) {
      const ti = list[li], t = m.tris[ti];
      if (t[0] === v || t[1] === v || t[2] === v) { ex.add(v*nT + ti); continue; }
      const ao = t[0]*3, bo = t[1]*3, co = t[2]*3;
      closestOnTri(px,py,pz, p[ao],p[ao+1],p[ao+2], p[bo],p[bo+1],p[bo+2], p[co],p[co+1],p[co+2]);
      const dx = px-cpt[0], dy = py-cpt[1], dz = pz-cpt[2];
      if (dx*dx + dy*dy + dz*dz < exclR2) ex.add(v*nT + ti);
    }
  }
  m.contactExcl = ex;

  /* --- EE exclusion at rest (edge list is static, built in buildEngineModel) --- */
  const cE = m.cEdges;
  binEdges(m, m.rest, exclR);
  const eex = new Set();
  const nE = cE.length;
  eeSeen.clear();
  eHash.forEach(list => {
    for (let li = 0; li < list.length; li++)
      for (let lj = li + 1; lj < list.length; lj++) {
        let ei = list[li], ej = list[lj];
        if (ei === ej) continue;
        if (ei > ej) { const tmp = ei; ei = ej; ej = tmp; }
        const pk = ei * nE + ej;
        if (eeSeen.has(pk)) continue;
        eeSeen.add(pk);
        const i1 = cE[ei][0], j1 = cE[ei][1], i2 = cE[ej][0], j2 = cE[ej][1];
        if (i1===i2 || i1===j2 || j1===i2 || j1===j2) { eex.add(pk); continue; }
        const o1=i1*3, o2=j1*3, o3=i2*3, o4=j2*3;
        closestSegSeg(p[o1],p[o1+1],p[o1+2], p[o2],p[o2+1],p[o2+2],
                      p[o3],p[o3+1],p[o3+2], p[o4],p[o4+1],p[o4+2]);
        const s = eeRes[0], t = eeRes[1];
        const ax = p[o1]+s*(p[o2]-p[o1]), ay = p[o1+1]+s*(p[o2+1]-p[o1+1]), az = p[o1+2]+s*(p[o2+2]-p[o1+2]);
        const bx = p[o3]+t*(p[o4]-p[o3]), by = p[o3+1]+t*(p[o4+1]-p[o3+1]), bz = p[o3+2]+t*(p[o4+2]-p[o3+2]);
        const dx = ax-bx, dy = ay-by, dz = az-bz;
        if (dx*dx + dy*dy + dz*dz < exclR2) eex.add(pk);
      }
  });
  m.eeExcl = eex;
}

/* One VT contact pass: detect all vertex–triangle pairs closer than h and (if
 * apply) project them apart along the separation direction, PBD-style, with
 * pinned vertices given zero weight. Returns the max penetration found.
 * If penGaps is given (measurement pass), each penetration is also attributed
 * to its gap(s): mask = vertex's gaps | triangle's face's gaps — a cross-TR
 * contact therefore counts toward BOTH TRs. */
function contactPass(m, p, h, apply, penGaps) {
  binTriangles(m, p, h);
  const cs = m.contactCS, tris = m.tris, nT = tris.length, ex = m.contactExcl, pin = m.pinned;
  const h2 = h * h;
  let maxPen = 0;
  for (let v = 0; v < m.nv; v++) {
    const vo = v*3;
    const px = p[vo], py = p[vo+1], pz = p[vo+2];
    const list = cHash.get(hashKey(Math.floor(px/cs), Math.floor(py/cs), Math.floor(pz/cs)));
    if (!list) continue;
    for (let li = 0; li < list.length; li++) {
      const ti = list[li];
      if (ex.has(v*nT + ti)) continue;
      const t = tris[ti], a = t[0], b = t[1], c = t[2];
      if (a === v || b === v || c === v) continue;
      const ao = a*3, bo = b*3, co = c*3;
      closestOnTri(px,py,pz, p[ao],p[ao+1],p[ao+2], p[bo],p[bo+1],p[bo+2], p[co],p[co+1],p[co+2]);
      let nx = px-cpt[0], ny = py-cpt[1], nz = pz-cpt[2];
      const d2 = nx*nx + ny*ny + nz*nz;
      if (d2 >= h2) continue;
      const d = Math.sqrt(d2);
      const pen = h - d;
      if (pen > maxPen) maxPen = pen;
      if (penGaps) {
        let mask = m.vertGapMask[v] | m.faceGapMask[m.triFace[ti]];
        for (let gg = 0; mask; gg++, mask >>>= 1)
          if ((mask & 1) && pen > penGaps[gg]) penGaps[gg] = pen;
      }
      if (!apply) continue;
      if (d > 1e-9) { nx /= d; ny /= d; nz /= d; }
      else {
        const e1x=p[bo]-p[ao], e1y=p[bo+1]-p[ao+1], e1z=p[bo+2]-p[ao+2];
        const e2x=p[co]-p[ao], e2y=p[co+1]-p[ao+1], e2z=p[co+2]-p[ao+2];
        nx = e1y*e2z - e1z*e2y; ny = e1z*e2x - e1x*e2z; nz = e1x*e2y - e1y*e2x;
        const nl = Math.hypot(nx, ny, nz) || 1;
        nx /= nl; ny /= nl; nz /= nl;
      }
      const u = cpt[3], vv = cpt[4], ww = cpt[5];
      const mV = pin[v] ? 0 : 1, mA = pin[a] ? 0 : 1, mB = pin[b] ? 0 : 1, mC = pin[c] ? 0 : 1;
      const denom = mV + mA*u*u + mB*vv*vv + mC*ww*ww;
      if (denom < 1e-9) continue;
      const s = pen / denom;
      p[vo]   += s*mV*nx;    p[vo+1] += s*mV*ny;    p[vo+2] += s*mV*nz;
      p[ao]   -= s*mA*u*nx;  p[ao+1] -= s*mA*u*ny;  p[ao+2] -= s*mA*u*nz;
      p[bo]   -= s*mB*vv*nx; p[bo+1] -= s*mB*vv*ny; p[bo+2] -= s*mB*vv*nz;
      p[co]   -= s*mC*ww*nx; p[co+1] -= s*mC*ww*ny; p[co+2] -= s*mC*ww*nz;
    }
  }
  return maxPen;
}

/* One EE contact pass: detect all edge pairs whose closest approach is under h
 * and (if apply) project them apart along the connecting direction with
 * barycentric weights, pinned vertices at zero weight. Returns max penetration.
 * If penGaps is given, penetration is attributed to the union of both edges'
 * gap masks (cross-TR contacts count toward both TRs). */
function edgePass(m, p, h, apply, penGaps) {
  binEdges(m, p, h);
  const E = m.cEdges, nE = E.length, ex = m.eeExcl, pin = m.pinned, gMask = m.cEdgeGapMask;
  const h2 = h * h;
  let maxPen = 0;
  eeSeen.clear();
  eHash.forEach(list => {
    for (let li = 0; li < list.length; li++)
      for (let lj = li + 1; lj < list.length; lj++) {
        let ei = list[li], ej = list[lj];
        if (ei === ej) continue;
        if (ei > ej) { const tmp = ei; ei = ej; ej = tmp; }
        const pk = ei * nE + ej;
        if (eeSeen.has(pk)) continue;
        eeSeen.add(pk);
        if (ex.has(pk)) continue;
        const i1 = E[ei][0], j1 = E[ei][1], i2 = E[ej][0], j2 = E[ej][1];
        if (i1===i2 || i1===j2 || j1===i2 || j1===j2) continue;
        const o1=i1*3, o2=j1*3, o3=i2*3, o4=j2*3;
        closestSegSeg(p[o1],p[o1+1],p[o1+2], p[o2],p[o2+1],p[o2+2],
                      p[o3],p[o3+1],p[o3+2], p[o4],p[o4+1],p[o4+2]);
        const s = eeRes[0], t = eeRes[1];
        const ax = p[o1]+s*(p[o2]-p[o1]), ay = p[o1+1]+s*(p[o2+1]-p[o1+1]), az = p[o1+2]+s*(p[o2+2]-p[o1+2]);
        const bx = p[o3]+t*(p[o4]-p[o3]), by = p[o3+1]+t*(p[o4+1]-p[o3+1]), bz = p[o3+2]+t*(p[o4+2]-p[o3+2]);
        let nx = ax-bx, ny = ay-by, nz = az-bz;
        const d2 = nx*nx + ny*ny + nz*nz;
        if (d2 >= h2) continue;
        const d = Math.sqrt(d2);
        const pen = h - d;
        if (pen > maxPen) maxPen = pen;
        if (penGaps) {
          let mask = gMask[ei] | gMask[ej];
          for (let gg = 0; mask; gg++, mask >>>= 1)
            if ((mask & 1) && pen > penGaps[gg]) penGaps[gg] = pen;
        }
        if (!apply) continue;
        if (d > 1e-9) { nx /= d; ny /= d; nz /= d; }
        else {
          // Degenerate: use cross of the two edge directions as the normal.
          const d1x=p[o2]-p[o1], d1y=p[o2+1]-p[o1+1], d1z=p[o2+2]-p[o1+2];
          const d2x=p[o4]-p[o3], d2y=p[o4+1]-p[o3+1], d2z=p[o4+2]-p[o3+2];
          nx = d1y*d2z - d1z*d2y; ny = d1z*d2x - d1x*d2z; nz = d1x*d2y - d1y*d2x;
          const nl = Math.hypot(nx, ny, nz);
          if (nl < 1e-9) continue;
          nx /= nl; ny /= nl; nz /= nl;
        }
        const w1 = 1-s, w2 = s, w3 = 1-t, w4 = t;
        const m1 = pin[i1]?0:1, m2 = pin[j1]?0:1, m3 = pin[i2]?0:1, m4 = pin[j2]?0:1;
        const denom = m1*w1*w1 + m2*w2*w2 + m3*w3*w3 + m4*w4*w4;
        if (denom < 1e-9) continue;
        const sc = pen / denom;
        p[o1]   += sc*m1*w1*nx; p[o1+1] += sc*m1*w1*ny; p[o1+2] += sc*m1*w1*nz;
        p[o2]   += sc*m2*w2*nx; p[o2+1] += sc*m2*w2*ny; p[o2+2] += sc*m2*w2*nz;
        p[o3]   -= sc*m3*w3*nx; p[o3+1] -= sc*m3*w3*ny; p[o3+2] -= sc*m3*w3*nz;
        p[o4]   -= sc*m4*w4*nx; p[o4+1] -= sc*m4*w4*ny; p[o4+2] -= sc*m4*w4*nz;
      }
  });
  return maxPen;
}

/* Combined watertight contact pass (VT + EE). Returns max penetration of both. */
function contactAll(m, p, h, apply, penGaps) {
  const a = contactPass(m, p, h, apply, penGaps);
  const b = edgePass(m, p, h, apply, penGaps);
  return a > b ? a : b;
}

/* Solve one keyframe under the given drive:
 *   drive = { cum: Float64Array per-rank cumulative closure, dy: fallback
 *             uniform displacement, s: sweep progress in [0,1] }.
 * Returns { pen, strain, penGaps, strainGaps } — global and PER-GAP residuals. */
function solveKeyframe(m, drive, prm, seed) {
  const p = m.pos;
  const h = (prm.contact && m.thick > 0) ? m.thick : 0;
  if (seed) applyCreaseCouple(m, p, 0.02 * m.scale);
  const biasIters = Math.floor(prm.iters * 0.4);
  const g = prm.gravity * 0.0008 * m.scale;
  let b = prm.bias * 0.004 * m.scale * Math.min(1, drive.s * 4 + 0.05);
  if (h > 0) b = Math.min(b, 0.45 * h); // keep per-iteration bias within the motion clamp
  const maxStep = 0.45 * h;
  const ff = m.frozenFlag;
  for (let it = 0; it < prm.iters; it++) {
    XPBD.resetLambdas(m.softCons);   
    if (h > 0) m.iterPrev.set(p); // snapshot for the anti-tunneling clamp
    for (const v of m.freeVerts) { if (ff[v]) continue; p[v*3+2] -= g; }
    if (it < biasIters) applyCreaseCouple(m, p, b);
    for (const c of m.stiffCons) projectDist(p, c.i, c.j, c.r, 1);
    for (const c of m.softCons) XPBD.projectDist(m, p, c);
    for (const pl of m.panels) projectPanelRigid(p, pl);
    applyPins(m, p, drive);
    if (prm.ground) projectGround(m, p);
    // Anti-tunneling clamp BEFORE contacts (so contact corrections are never
    // clamped), then contacts every iteration as the last op — contacts get
    // the final word; PBD reconciles them with panels/springs over iterations.
    if (h > 0) {
      clampStep(m, p, maxStep);
      contactAll(m, p, h, true);
    }
  }
  const polish = h > 0 ? 25 : 10;
  for (let it = 0; it < polish; it++) {
    XPBD.resetLambdas(m.softCons); 
    if (h > 0) contactAll(m, p, h, true);
    for (const c of m.stiffCons) projectDist(p, c.i, c.j, c.r, 1);
    for (const c of m.softCons) XPBD.projectDist(m, p, c); 
    for (const pl of m.panels) projectPanelRigid(p, pl);
    applyPins(m, p, drive);
    if (prm.ground) projectGround(m, p);
  }
  // ---- Jam diagnostics after full convergence attempt ----
  const penGaps = m.diagPenGaps, strainGaps = m.diagStrainGaps;
  penGaps.fill(0); strainGaps.fill(0);
  const pen = h > 0 ? contactAll(m, p, h, false, penGaps) : 0;
  let strain = 0;
  for (const c of m.texStrainCons) {
    const ix = c.i*3, jx = c.j*3;
    const d = Math.hypot(p[jx]-p[ix], p[jx+1]-p[ix+1], p[jx+2]-p[ix+2]);
    const e = Math.abs(d - c.r) / c.r;
    if (e > strain) strain = e;
    let mask = c.mask;
    for (let gg = 0; mask; gg++, mask >>>= 1)
      if ((mask & 1) && e > strainGaps[gg]) strainGaps[gg] = e;
  }
  return { pen, strain, penGaps, strainGaps };
}


/* ═══════════════════════════════════════════════════════════════════════════
 * §7f — TPU INLAY EXPORT: PULLING RODS + FRAME MEMBERS
 * ═══════════════════════════════════════════════════════════════════════════
 *
 * Builds the printable INLAY geometry for every TR of the canvas: two frame
 * MEMBER SETS per TR (eyelet side / tab side) plus the horizontal PULLING
 * RODS that anchor the TPU band to the fabric. All coordinates are in mm,
 * local per TR, later mapped into the export sheet by buildInlayExport.
 *
 * DIMENSIONS (derived, never hard-coded):
 *   innerLength = (C - 1) * S.needlePitch + 2         inner window width
 *   outerSpan   = innerLength + 2 * S.memberThickness fabric width from the
 *                 canvas column count via the editor's needle-pitch formulas
 *   ringCX      = outerSpan / 2 + S.discRadius - 1    ring/disc center x
 *
 * PULLING RODS (§7f.1 — GENERAL CASE, TU4–TU7):
 *   Critical points — a CP is the endpoint of a horizontal valley crease
 *     on a TUBox's LEFT/RIGHT edge. The edge rule is IDENTICAL for all
 *     four types:
 *       left-aligned   → CP(s) on the RIGHT edge → LEFT rod  (top band);
 *       right-aligned  → CP(s) on the LEFT edge  → RIGHT rod (bottom band);
 *       middle-aligned → both edges serve CPs.
 *     TU4/5 contribute ONE CP per served edge, at the fabric center (the
 *     TPU window's horizontal middle line); TU6/7 contribute TWO per
 *     served edge, one per crease line at ±(B+3) about the center.
 *   Pre-set condition — within one TR, every TU6/7 crease must sit on the
 *     TR's TWO COMMON horizontal lines, so all TU6/7 members of a TR must
 *     share the SAME beam scale and diagonal step. buildInlayExport
 *     rejects the canvas with an explicit reason when violated (see
 *     inlayBeamConditionError). A mixed TR therefore carries up to three
 *     line levels: top common line, window middle line (TU4/5 CPs),
 *     bottom common line — the three-rod structure.
 *   Rods — bucketed by (anchor side, crease level): ONE rod per level per
 *     band, hanging 0.5 below its crease-hold line, growing ONE
 *     T-crossbar per served CP (crossbar axis exactly at the CP's x) and
 *     terminating at its FARTHEST crossbar axis (convention "a": the tip
 *     bisects the terminal crossbar; intermediate crossbars are passed
 *     through). Two opposite rods on the same level may overlap along
 *     their shared stretch — the solids union at slicing time; each CP's
 *     crossbar is grown exactly once, by its owning rod.
 *   T-ends — each crossbar end is capped by a QUARTER sphere (not a half
 *     sphere): the flat side faces INWARD along the crossbar, the rounded
 *     quarter faces the OUTER side of the T. The two flat faces are the
 *     datum: exactly 6 mm apart, PER CROSSBAR, always centered on its own
 *     crease line (a crossbar never spans multiple crease lines).
 *   Print rule — the rod sits ON the printing bed: the bottom-most points
 *     of the body have 0 offset above the z = 0 ground plane, including
 *     the 180°-rotated dropping/flipped sets (bed contact improves
 *     printing quality).
 *
 * FRAME MEMBERS:
 *   SPIKE frame (TR contains TU4/TU5) — eyelet member: 1.85 shelf tip +
 *     chamfer + arm + ring + weaken notch at the datum; tab member: shelf
 *     tip + down-chamfer + notch. Feet at −(R+3); rc = R+3 → the two sets
 *     interlock at the fabric center, rod-to-rod = 2R+6.
 *   BEAM frame (TR contains TU6/TU7) — the SAME member geometry as the
 *     spike frame, with recalculated end lengths: the eyelet member's
 *     shelf/head sits at the TOP common line and carries ONE plain arm +
 *     ring + notch pair at the BOTTOM common line; the tab member's shelf
 *     sits at the bottom common line (the unbalanced band). Arm/ring
 *     lines are ALWAYS exactly the TR's two common lines — a mixed TR's
 *     TU4/5 middle-line rods anchor into the plain member face with NO
 *     arm/ring/disc of their own (frame ends follow the pure-TU6/7 rule).
 *     Feet at −(R+cap+3) = −off (foot bottom on the rod axis);
 *     rc = off + discRadius + 3 → rod-to-rod = 2·off + 12, a pure PRINT
 *     clearance: the two beam bodies do not interlock in the file — they
 *     mate on the fabric at assembly.
 *
 * DERIVATION (inlayDerive) — one record per TR:
 *   { R, C, kind: 'spike'|'beam', cap, armLines, tabShelf, feet, off, rc,
 *     P, innerLength, outerSpan, ringCX }
 *   off = rod axis → shelf datum (TOP common line for beams);
 *   rc  = half the rod-to-rod spacing used by inlayChainMesh and the
 *         dialog's rise readout;
 *   armLines = the TR's common-line y offsets, sorted descending, starting
 *              at 0 (beam frames: exactly [0, −2·cap]).
 *
 * INTEGRATION — gated: buildInlayExport is only invoked from the export
 *   dialog when the INLAY module is enabled; solver/user-tuning options
 *   remain the core path (modular MCV-style independence). Validated
 *   incrementally: first the special case "TR has only a TU4/5 spanning
 *   the TR width" against the reference DXF, then the general case where
 *   a TR contains multiple TUs and some may be TU4/5.
 *
 * SECTION MAP:
 *   §7f.1 inlayDerive              per-TR dimension record
 *   §7f.2 inlayMemberProfileSpike  TU4/5 member outline (eyelet/tab)
 *   §7f.3 inlayMemberProfileBeam   TU6/7 member outline (v3, see above)
 *   §7f.4 inlayMemberSetMesh       profile → extruded body + rings/discs
 *   §7f.5 pullRodsForTR            CP detection + rod bodies + T-ends
 *   §7f.6 inlayChainMesh           places the two sets at ±rc, print layout
 *   §7f.7 buildInlayExport         sheet assembly, z=0 bed-contact pass
 * ═══════════════════════════════════════════════════════════════════════ */

const PRINT_SPEC = {
  memberThickness:     2.0,   // frame member thickness (x)
  compressingRodDia:   2.0,   // Ø of the compressing rod (= plateDepth: flush with faces)
  armThickness:        3.0,   // eyelet arm full thickness (±1.5 about its crease line)
  reliefRadius:        0.7,   // weaken-notch r AND foot-step round r (foot face = outer − 0.6)
  discRadius:          3.0,
  holeRadius:          1.0,
  innerFaceToDiscEdge: 5.0,   // member INNER face → eyelet ring near edge
  shelfDepth:          1.85,  // shelf / tab tip past the OUTER face
  chamferRun:          0.375, // chamfer: 0.375 run over the 1.5 arm-half rise (~76°)
  plateDepth:          2.0,
  needlePitch:         4.5,
  innerMargin:         3.0,   // window = (C−1)·pitch + clearance  (57 @ C=13, per DXF)
  pairShelfOffset:     10.0,  // SPIKE frames only: mate's shelf sits 10 past this
                              // body's tab line (folded into rc = R+8 = off+5)
  SEG_CYL: 48, SEG_DISC: 64, SEG_RELIEF: 6,
};

/* Which frame does a TR need? Any TU6/7 member → the 'beam' frame.
 * cap = max(B+3): the frame's shelf datum sits at fabric-center + cap. */
function trBeamInfo(tr) {
  let cap = 0;
  tr.tus.forEach(tu => {
    if (tu.type === 'TU6' || tu.type === 'TU7')
      cap = Math.max(cap, tu.params.beamScale + 3);
  });
  return cap > 0 ? { cap } : null;
}

/* PRE-SET CONDITION (§7f.1, general case) — within one TR, all crease
 * lines must sit on the TR's two common horizontal lines, which requires
 * every TU6/7 member of that TR to share the SAME beam scale and diagonal
 * step (together with the TR's existing heightsEqual rule this pins both
 * common lines). Returns '' when the whole canvas satisfies the condition,
 * else a human-readable rejection reason for the export dialog. TU4/5
 * members are exempt: their single crease sits on the window middle line,
 * BETWEEN the two common lines. */
function inlayBeamConditionError(builtTRs) {
  for (const tr of builtTRs) {
    const beams = tr.tus.filter(tu => tu.type === 'TU6' || tu.type === 'TU7');
    if (beams.length < 2) continue;
    const b0 = beams[0].params.beamScale, d0 = beams[0].params.diagonalStep;
    for (const tu of beams) {
      if (tu.params.beamScale !== b0 || tu.params.diagonalStep !== d0)
        return `TR ${tr.TRid}: all TU6/TU7 members must share the same beam scale and diagonal step ` +
               `(found beam ${b0} / step ${d0} vs beam ${tu.params.beamScale} / step ${tu.params.diagonalStep}) — ` +
               `every crease line must sit on the TR's two common horizontal lines.`;
    }
  }
  return '';
}

/* Local frame per MEMBER SET: y = 0 is the SHELF datum line, x = 0 is the
 * window center, z = 0 is the plate mid-plane. Derived fields:
 *   off — rod axis → shelf datum          rc  — rod axis → fabric center
 *   armLines — eyelet arm/ring crease-hold lines (≤ 0, sorted desc, [0]
 *              first)                     tabShelf — tab member's shelf line
 *   feet — foot bottom = the rod-axis line the set seats on
 * SPIKE frame: single line at 0, tab at 0, feet −(R+3), off R+3, rc R+8.
 * BEAM frame (TU6/7): shelf datum = TOP crease-hold line; an eyelet arm per
 * line; tab shelf at the LOWEST line (the unbalanced band); fabric mounted
 * 1 mm shy of taut per side; the shelf/tab interlock happens AT the crease
 * lines (ring lines = mate's tab line). */
function inlayDerive(R, C, beam = null) {
  const S = PRINT_SPEC;
  const outerSpan = (C - 1) * S.needlePitch + 2
                  + 2 * (S.innerFaceToDiscEdge + S.discRadius * 2);
  const innerLength = outerSpan - 2 * (S.innerFaceToDiscEdge + S.discRadius * 2);
  const ringCX = innerLength / 2 + S.innerFaceToDiscEdge + S.discRadius;
  if (!beam)
    return { R, C, kind: 'spike', P: R + 7, off: R + 3, rc: R + 8,
             armLines: [0], tabShelf: 0, feet: -(R + 3),
             innerLength, outerSpan, ringCX };
  return { R, C, kind: 'beam', cap: beam.cap,
           armLines: beam.armLines,                  // sorted desc, starts at 0
           tabShelf: Math.min(...beam.armLines),
           feet: -(R + beam.cap + 3),
           off: R + beam.cap + 3,                    // rod axis → shelf datum
           rc:  R + beam.cap + 3 + S.discRadius + 3, // rod axis → fabric center
           P: R + beam.cap + 3,
           innerLength, outerSpan, ringCX };
}

/* Ear-clipper for a simple polygon (either orientation → normalized CCW). */
function inlayEarClip(pts) {
  let area = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const idx = pts.map((_, i) => i);
  if (area < 0) idx.reverse();
  const cross = (a, b, c) =>
    (pts[b][0] - pts[a][0]) * (pts[c][1] - pts[a][1]) -
    (pts[b][1] - pts[a][1]) * (pts[c][0] - pts[a][0]);
  const inTri = (q, a, b, c) => cross(a, b, q) > 1e-12 && cross(b, c, q) > 1e-12 && cross(c, a, q) > 1e-12;
  const tris = [];
  let guard = 0;
  while (idx.length > 3 && guard++ < 10000) {
    let clipped = false;
    for (let i = 0; i < idx.length; i++) {
      const p = idx[(i - 1 + idx.length) % idx.length], c = idx[i], n = idx[(i + 1) % idx.length];
      if (cross(p, c, n) <= 1e-12) continue;
      let ok = true;
      for (const q of idx) { if (q === p || q === c || q === n) continue; if (inTri(q, p, c, n)) { ok = false; break; } }
      if (!ok) continue;
      tris.push([p, c, n]); idx.splice(i, 1); clipped = true; break;
    }
    if (!clipped) break;
  }
  if (idx.length === 3) tris.push([idx[0], idx[1], idx[2]]);
  else if (idx.length > 3) for (let i = 1; i < idx.length - 1; i++) tris.push([idx[0], idx[i], idx[i + 1]]);
  return tris;
}

/* Extrude a profile (any orientation; normalized CCW) from z0 to z1. */
function inlayExtrude(out, pts, z0, z1) {
  let area = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    area += a[0] * b[1] - b[0] * a[1];
  }
  if (area < 0) pts = pts.slice().reverse();
  const tris = inlayEarClip(pts);
  for (const t of tris) {
    const [a, b, c] = t.map(i => pts[i]);
    out.push(a[0], a[1], z1, b[0], b[1], z1, c[0], c[1], z1);   // top cap (+z)
    out.push(a[0], a[1], z0, c[0], c[1], z0, b[0], b[1], z0);   // bottom cap (−z)
  }
  for (let i = 0; i < pts.length; i++) {                        // side walls
    const a = pts[i], b = pts[(i + 1) % pts.length];
    out.push(a[0], a[1], z0, b[0], b[1], z0, b[0], b[1], z1);
    out.push(a[0], a[1], z0, b[0], b[1], z1, a[0], a[1], z1);
  }
}

/* Extruded annulus (the eyelet ring with its bore). */
function inlayAnnulus(out, cx, cy, rO, rI, z0, z1, seg) {
  for (let i = 0; i < seg; i++) {
    const a0 = 2 * Math.PI * i / seg, a1 = 2 * Math.PI * (i + 1) / seg;
    const o0 = [cx + rO * Math.cos(a0), cy + rO * Math.sin(a0)], o1 = [cx + rO * Math.cos(a1), cy + rO * Math.sin(a1)];
    const i0 = [cx + rI * Math.cos(a0), cy + rI * Math.sin(a0)], i1 = [cx + rI * Math.cos(a1), cy + rI * Math.sin(a1)];
    out.push(i0[0], i0[1], z1, o0[0], o0[1], z1, o1[0], o1[1], z1);  // top cap
    out.push(i0[0], i0[1], z1, o1[0], o1[1], z1, i1[0], i1[1], z1);
    out.push(i0[0], i0[1], z0, o1[0], o1[1], z0, o0[0], o0[1], z0);  // bottom cap
    out.push(i0[0], i0[1], z0, i1[0], i1[1], z0, o1[0], o1[1], z0);
    out.push(o0[0], o0[1], z0, o1[0], o1[1], z0, o1[0], o1[1], z1);  // outer wall
    out.push(o0[0], o0[1], z0, o1[0], o1[1], z1, o0[0], o0[1], z1);
    out.push(i1[0], i1[1], z0, i0[0], i0[1], z0, i0[0], i0[1], z1);  // inner wall (bore)
    out.push(i1[0], i1[1], z0, i0[0], i0[1], z1, i1[0], i1[1], z1);
  }
}

/* Cylinder along X centered at (cy, cz) — the compressing rod. */
function inlayCylinderX(out, x0, x1, cy, cz, r, seg) {
  for (let i = 0; i < seg; i++) {
    const a0 = 2 * Math.PI * i / seg, a1 = 2 * Math.PI * (i + 1) / seg;
    const y0 = cy + r * Math.cos(a0), z0 = cz + r * Math.sin(a0);
    const y1 = cy + r * Math.cos(a1), z1 = cz + r * Math.sin(a1);
    out.push(x0, y0, z0, x0, y1, z1, x1, y1, z1);                 // wall
    out.push(x0, y0, z0, x1, y1, z1, x1, y0, z0);
    out.push(x1, cy, cz, x1, y0, z0, x1, y1, z1);                 // +x cap
    out.push(x0, cy, cz, x0, y1, z1, x0, y0, z0);                 // −x cap
  }
}

/* SPIKE frame-member profile (+x side; mirror x for the −x member). Matches
 * the DXFs exactly: shelf edge at y = 0 out to outer+1.85, chamfer up into
 * the arm (eyelet side) or down under the tab (far side), r=0.6 weaken notch
 * below the arm, outer face down to −(R+1.4), r=0.6 step round onto the
 * foot face (outer − 0.6), foot bottom at −(R+3) = the rod axis. */
function inlayMemberProfile(d, eyelet) {
  const S = PRINT_SPEC;
  const xi = d.innerLength / 2;
  const xo = xi + S.memberThickness;
  const xf = xo - S.reliefRadius;
  const aH = S.armThickness / 2;
  const tip = xo + S.shelfDepth, knee = tip - S.chamferRun;
  const pts = [];
  pts.push([xi, 0]);
  pts.push([tip, 0]);
  if (eyelet) {
    pts.push([knee, aH]);
    const armTip = d.ringCX - Math.sqrt(S.discRadius * S.discRadius - aH * aH) + 0.4;
    pts.push([armTip, aH]);              // arm top edge, overlapping into the ring band
    pts.push([armTip, -aH]);
  } else {
    pts.push([knee, -aH]);               // tab: chamfer down instead of an arm
  }
  pts.push([xo, -aH]);
  const rc = -aH - S.reliefRadius;       // weaken notch: half-circle into the face
  for (let i = 1; i < 2 * S.SEG_RELIEF; i++) {
    const a = Math.PI / 2 + Math.PI * (i / (2 * S.SEG_RELIEF));
    pts.push([xo + S.reliefRadius * Math.cos(a), rc + S.reliefRadius * Math.sin(a)]);
  }
  pts.push([xo, rc - S.reliefRadius]);
  pts.push([xo, -(d.R + 2) + S.reliefRadius]);
  for (let i = 1; i <= S.SEG_RELIEF; i++) {       // step round onto the foot face
    const a = Math.PI / 2 + (Math.PI / 2) * (i / S.SEG_RELIEF);
    pts.push([xo + S.reliefRadius * Math.cos(a), -(d.R + 2) + S.reliefRadius * Math.sin(a)]);
  }
  pts.push([xf, -(d.R + 3)]);
  pts.push([xi, -(d.R + 3)]);
  return pts;                            // closes up the inner face to (xi, 0)
}

/* BEAM frame-member profile (TU6/7 TRs) — v3, decoded from the reference DXF:
 * the SAME member geometry as the TU4/5 spike frame; only the end lengths
 * are recalculated for the two crease lines.
 * EYELET member: the spike eyelet head (1.85 shelf tip + chamfer + arm +
 *   ring + weaken notch) sits at the DATUM = the TOP crease line (y = 0);
 *   every LOWER crease line gets a PLAIN full arm (outer face → armTip, no
 *   shelf/chamfer) with its own ring and weaken notches ABOVE and BELOW;
 *   the outer face then runs down to the foot (foot bottom = d.feet = −off,
 *   i.e. ON the rod axis, exactly like the spike frame).
 * TAB member: the UNMODIFIED spike tab (shelf tip + down-chamfer + notch),
 *   shifted down so its shelf sits at the LOWEST crease line (d.tabShelf) —
 *   the two member ends differ by the crease separation, the "unbalanced
 *   TPU band". */
function inlayMemberProfileBeam(d, eyelet) {
  const S = PRINT_SPEC;
  const xi = d.innerLength / 2, xo = xi + S.memberThickness, xf = xo - S.reliefRadius;
  const aH = S.armThickness / 2;
  const tip = xo + S.shelfDepth, knee = tip - S.chamferRun;
  const armTip = d.ringCX - Math.sqrt(S.discRadius * S.discRadius - aH * aH) + 0.4;
  const pts = [];
  const notch = (rc) => {                // caller pushes the entry point (xo, rc+r) first
    for (let i = 1; i < 2 * S.SEG_RELIEF; i++) {
      const a = Math.PI / 2 + Math.PI * (i / (2 * S.SEG_RELIEF));
      pts.push([xo + S.reliefRadius * Math.cos(a), rc + S.reliefRadius * Math.sin(a)]);
    }
    pts.push([xo, rc - S.reliefRadius]);
  };
  const footDown = () => {               // outer face → step round → foot face → rod axis
    pts.push([xo, d.feet + 1 + S.reliefRadius]);
    for (let i = 1; i <= S.SEG_RELIEF; i++) {
      const a = Math.PI / 2 + (Math.PI / 2) * (i / S.SEG_RELIEF);
      pts.push([xo + S.reliefRadius * Math.cos(a), d.feet + 1 + S.reliefRadius * Math.sin(a)]);
    }
    pts.push([xf, d.feet], [xi, d.feet]);
  };
  if (eyelet) {
    pts.push([xi, 0], [tip, 0], [knee, aH],              // TU4/5 eyelet head at the datum
             [armTip, aH], [armTip, -aH], [xo, -aH]);
    notch(-aH - S.reliefRadius);
    d.armLines.filter(L => L < -1e-9).forEach(L => {     // plain arm per LOWER crease line
      pts.push([xo, L + aH + 2 * S.reliefRadius]);
      notch(L + aH + S.reliefRadius);                    // weaken notch ABOVE the arm
      pts.push([armTip, L + aH], [armTip, L - aH], [xo, L - aH]);
      notch(L - aH - S.reliefRadius);                    // and BELOW it
    });
    footDown();
  } else {
    const Ls = d.tabShelf;                               // TU4/5 tab shifted to the lowest line
    pts.push([xi, Ls], [tip, Ls], [knee, Ls - aH], [xo, Ls - aH]);
    notch(Ls - aH - S.reliefRadius);
    footDown();
  }
  return pts;                            // closes up the inner face to the start
}

/* One MEMBER SET (no rod): eyelet member (+x), tab member (−x), one ring
 * per arm line (spike frames have exactly one, at the datum). */
function inlayMemberSetMesh(d) {
  const S = PRINT_SPEC, out = [], hz = S.plateDepth / 2;
  if (d.kind === 'beam') {
    inlayExtrude(out, inlayMemberProfileBeam(d, true), -hz, hz);
    inlayExtrude(out, inlayMemberProfileBeam(d, false).map(p => [-p[0], p[1]]), -hz, hz);
    d.armLines.forEach(L =>
      inlayAnnulus(out, d.ringCX, L, S.discRadius, S.holeRadius, -hz, hz, S.SEG_DISC));
  } else {
    inlayExtrude(out, inlayMemberProfile(d, true), -hz, hz);
    inlayExtrude(out, inlayMemberProfile(d, false).map(p => [-p[0], p[1]]), -hz, hz);
    inlayAnnulus(out, d.ringCX, 0, S.discRadius, S.holeRadius, -hz, hz, S.SEG_DISC);
  }
  return out;
}

/* ---------------------------------------------------------------------------
 * §7f.1 · PULLING RODS (general case: any TR containing TU4–TU7 members)
 * ---------------------------------------------------------------------------
 * A CRITICAL POINT (CP) is the endpoint of a horizontal valley crease on a
 * TUBox's left/right edge. THE EDGE RULE IS IDENTICAL FOR ALL FOUR TYPES:
 *   left-aligned  → right-edge CP(s) → LEFT rod  (dropping set / top band)
 *   right-aligned → left-edge CP(s)  → RIGHT rod (rising set / bottom band)
 *   middle        → both.
 * TU4/5 contribute ONE CP per served edge at the fabric center (level 0);
 * TU6/7 contribute TWO per served edge, at levels ±(B+3) about the center.
 * Rods bucket by (anchor, crease level): ONE rod per level per band, each
 * hanging 0.5 below its crease-hold line
 *   y = (level − cap) − shelfOffset          (local; shelf datum = 0)
 * which degenerates to the old single rod at y = −0.5 in a pure-TU4/5 TR
 * (cap = 0). Each rod carries one T-crossbar per served CP, with the
 * crossbar AXIS exactly at the CP's x; the rod body terminates at its
 * FARTHEST crossbar axis. length = margin + d·fabricStitch, measured inner
 * face → farthest crossbar axis, where d = the CP's stitch distance from
 * the anchor-side fabric edge and
 *   margin = ((C−1)·needlePitch + 2 − C·3) / 2   (fabric centered in window)
 * Checks: C = 7, d = 7 → 25 mm (TU4 DXF); C = 14, d = 14 → 51.25 mm, rods
 * at ±(B+3) ∓ 0.5 about the fabric center (TU6 shared-band DXF).
 * The rods of one band live on one frame body, the other band's on the
 * mate — assembled, the two rods of one crease sit 0.5 above/below the
 * line (1 mm apart, no collision). z bed-tangent (axis −hz + 0.4, prints
 * flat with the plate); the anchor stub reaches anchorEmbed into the
 * member body so the solids overlap and union at slicing time.
 * -------------------------------------------------------------------------*/
const PULLROD_SPEC = {
  rodDia: 0.8,
  shelfOffset: 0.5,     // crease-hold line → rod centerline (0.4 + 0.1)
  crossArm: 2.6,        // rod surface → knob FLAT FACE (axis → face = 3.0;
                        // the two flat faces are the datum: 6 mm apart)
  knobR: 1.0,           // half-ball knob radius (flat on bed, flat on the
                        // crossbar-end plane; rounded quarter dome outward)
  knobEmbed: 0.2,       // crossbar tip extended PAST the flat face into the
                        // dome interior (fusion, not touch) — knob centers
                        // themselves stay exactly at ±3.0
  fabricStitch: 3.0,    // relaxed fabric width per stitch (C × 3)
  anchorEmbed: 1.0,     // fusion overlap into the member body
  SEG: 24, SEG_KNOB: 16, DOME_RINGS: 6,
};

/* margin = anchor member INNER face → fabric edge (fabric centered in window).
 * Check: C = 7 → (29 − 21)/2 = 4 mm (reference DXF). */
function pullRodMargin(C) {
  const inner = (C - 1) * PRINT_SPEC.needlePitch + 2;   // window inner width
  return (inner - C * PULLROD_SPEC.fabricStitch) / 2;
}

/* Rod length = margin + d, where d = CP distance from the anchor-side fabric
 * edge (in stitches). Option (a): the rod tip bisects the FARTHEST crossbar —
 * no +0.5 adjustment; the crossbar axis sits exactly at the CP's x. */
function pullRodLength(C, dStitches) {
  return pullRodMargin(C) + dStitches * PULLROD_SPEC.fabricStitch;
}

/* CPs → rods, bucketed by (anchor, crease level). Returns
 * [{ anchor, set, y, line, cps }]: `line` is the crease-hold line in the
 * member-set local frame (≤ 0 below the shelf datum), `y` the rod axis
 * (line − shelfOffset), `cps` the stitch distances from the anchor-side
 * fabric edge. */
function pullRodsForTR(tr) {
  const C = tr.width;
  const beam = trBeamInfo(tr);
  const cap = beam ? beam.cap : 0;
  const rods = new Map();
  const add = (anchor, set, level, d) => {
    const line = level - cap;                       // crease-hold line, ≤ 0
    const y = line - PULLROD_SPEC.shelfOffset;
    const k = anchor + '|' + y.toFixed(3);
    if (!rods.has(k)) rods.set(k, { anchor, set, y, line, cps: [] });
    rods.get(k).cps.push(d);
  };
  tr.tus.forEach((tu, idx) => {
    const spike = tu.type === 'TU4' || tu.type === 'TU5';
    const beamTU = tu.type === 'TU6' || tu.type === 'TU7';
    if (!spike && !beamTU) return;
    const levels = spike ? [0]
      : [tu.params.beamScale + 3, -(tu.params.beamScale + 3)];
    const l = tu.colStart - tr.colStart;              // left TUBox edge (stitches)
    const r = l + tr._builds[idx].boxWidth;           // right TUBox edge
    const a = tu.params.spikeAlignment;
    levels.forEach(L => {
      if (a === -1 || a === 2) add('left',  'dropping', L, r);       // right-edge CP
      if (a ===  1 || a === 2) add('right', 'rising',   L, C - l);   // left-edge CP
    });
  });
  return [...rods.values()];
}

/* Cylinder along Y at (cx, cz) — the T crossbar. */
function pullCylinderY(out, cx, cz, y0, y1, r, seg) {
  for (let i = 0; i < seg; i++) {
    const a0 = 2 * Math.PI * i / seg, a1 = 2 * Math.PI * (i + 1) / seg;
    const z0 = cz + r * Math.cos(a0), x0 = cx + r * Math.sin(a0);
    const z1 = cz + r * Math.cos(a1), x1 = cx + r * Math.sin(a1);
    out.push(x0, y0, z0, x1, y0, z1, x1, y1, z1);                 // wall
    out.push(x0, y0, z0, x1, y1, z1, x0, y1, z0);
    out.push(cx, y1, cz, x0, y1, z0, x1, y1, z1);                 // +y cap
    out.push(cx, y0, cz, x1, y0, z1, x0, y0, z0);                 // −y cap
  }
}

/* Quarter-sphere knob: flat on the bed (zBase), flat on the crossbar-end
 * plane (y = cy), rounded quarter dome facing OUTWARD (sY = ±1 → dome
 * toward ±y). Built ONCE in canonical +y orientation, then reflected about
 * y = cy for sY = −1 with the triangle winding swapped — both signs share
 * one code path, so their orientation can never diverge again. */
function pullKnobQuarter(out, cx, cy, zBase, R, sY, seg, rings) {
  const t = [];
  const ring = (rr, zz) => {
    const pts = [];
    for (let j = 0; j <= seg; j++) {
      const a = Math.PI * j / seg;                 // +y half: (cx+R) → (cx−R)
      pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a), zz]);
    }
    return pts;
  };
  let prev = ring(R, zBase);
  for (let j = 0; j < seg; j++) {                  // flat base half-disc (−z)
    const a = prev[j], b = prev[j + 1];
    t.push(cx, cy, zBase, b[0], b[1], b[2], a[0], a[1], a[2]);
  }
  for (let m = 1; m < rings; m++) {                // quarter-dome bands
    const ph = (Math.PI / 2) * m / rings;
    const cur = ring(R * Math.cos(ph), zBase + R * Math.sin(ph));
    for (let j = 0; j < seg; j++) {                // open strip — no wrap
      t.push(prev[j][0], prev[j][1], prev[j][2], prev[j+1][0], prev[j+1][1], prev[j+1][2], cur[j+1][0], cur[j+1][1], cur[j+1][2]);
      t.push(prev[j][0], prev[j][1], prev[j][2], cur[j+1][0], cur[j+1][1], cur[j+1][2], cur[j][0], cur[j][1], cur[j][2]);
    }
    prev = cur;
  }
  for (let j = 0; j < seg; j++) {                  // apex fan
    const a = prev[j], b = prev[j + 1];
    t.push(a[0], a[1], a[2], b[0], b[1], b[2], cx, cy, zBase + R);
  }
  /* Flat vertical face at y = cy (outward normal −y in canonical form).
   * Arc sampled at 2·rings steps so its points coincide EXACTLY with the
   * dome-ring seam vertices at every elevation → watertight. */
  const N = 2 * rings;
  for (let i = 0; i < N; i++) {
    const p0 = Math.PI * i / N, p1 = Math.PI * (i + 1) / N;
    t.push(cx, cy, zBase,
           cx + R * Math.cos(p0), cy, zBase + R * Math.sin(p0),
           cx + R * Math.cos(p1), cy, zBase + R * Math.sin(p1));
  }
  if (sY > 0) { out.push(...t); return; }
  for (let i = 0; i < t.length; i += 9) {          // mirror y about cy, swap B↔C
    out.push(t[i],     2 * cy - t[i + 1], t[i + 2],
             t[i + 6], 2 * cy - t[i + 7], t[i + 8],
             t[i + 3], 2 * cy - t[i + 4], t[i + 5]);
  }
}

/* ONE pulling rod in member-set local coordinates. anchorLeft is LOCAL;
 * cps = stitch distances from the anchor-side fabric edge; y = the rod's
 * axis line from pullRodsForTR (−0.5 for spike frames; per crease level
 * for beam frames). One identical T-crossbar (bar + two knobs) per CP,
 * axis exactly at margin + d; the rod body runs from the anchor stub to
 * the FARTHEST axis (option a: tip bisects the terminal crossbar;
 * intermediate crossbars are passed through). */
function pullRodMesh(d, anchorLeft, cps, y) {
  const S = PULLROD_SPEC, out = [];
  const r = S.rodDia / 2;
  const hz = PRINT_SPEC.plateDepth / 2;
  const z = -hz + r;                        // bed-tangent axis
  const xi = d.innerLength / 2;
  const s = anchorLeft ? 1 : -1;
  const margin = pullRodMargin(d.C);
  const xA = -s * (xi + S.anchorEmbed);     // stub end, embedded in the member
  const axes = cps.map(dc => -s * xi + s * (margin + dc * S.fabricStitch));
  const xT = s > 0 ? Math.max(...axes) : Math.min(...axes);   // farthest axis = rod tip
  inlayCylinderX(out, Math.min(xA, xT), Math.max(xA, xT), y, z, r, S.SEG);
  const arm = r + S.crossArm;               // axis → knob flat face = 3.0
  axes.forEach(xC => {
    pullCylinderY(out, xC, z, y - (arm + S.knobEmbed), y + (arm + S.knobEmbed), r, S.SEG);
    pullKnobQuarter(out, xC, y - arm, -hz, S.knobR, -1, S.SEG_KNOB, S.DOME_RINGS);
    pullKnobQuarter(out, xC, y + arm, -hz, S.knobR, +1, S.SEG_KNOB, S.DOME_RINGS);
  });
  return out;
}

/* Append triangles under an (x, y) map; z is preserved. Only translations
 * and 180° rotations are used, so triangle winding (normals) is preserved. */
function inlayAppend(out, tris, f) {
  for (let i = 0; i < tris.length; i += 3) {
    const p = f(tris[i], tris[i + 1]);
    out.push(p[0], p[1], tris[i + 2]);
  }
}

/* THE TOOL — one chain of n stacked TRs (ds bottom→top). Rod k sits at
 * rodY[k]; window k+1 (compressing TR k+1, i.e. ds[k]) lies between rods k
 * and k+1, spaced 2·rc of that window apart (spike: 2(R+3)+10; beam: 2R+6,
 * the taut interlock-at-crease-lines mating). Each window gets a RISING set
 * (feet on its lower rod, shelf datum at rodY[k] + off, eyelet +x) and a
 * DROPPING set (the 180° rotation, feet on its upper rod, eyelet −x).
 * Every interior rod therefore carries one rising and one dropping set =
 * the four-ended shared middle frame; the end rods carry one set each.
 * n = 1 reproduces exactly the previous two-body pair.
 * PULLING RODS ride their owning member set through the SAME (x, y) map, so
 * they stay correct in chains and in 180°-rotated dropping sets alike. */
function inlayChainMesh(item) {
  const S = PRINT_SPEC, out = [];
  const ds = item.ds;
  const pulls = item.pulls || ds.map(() => []);
  const n = ds.length;
  const xf = ds[0].innerLength / 2 + S.memberThickness - S.reliefRadius;
  const rodY = [0];
  for (let k = 0; k < n; k++) rodY.push(rodY[k] + 2 * ds[k].rc);
  for (let k = 0; k <= n; k++) {
    inlayCylinderX(out, -xf, xf, rodY[k], 0, S.compressingRodDia / 2, S.SEG_CYL);
    if (k < n) {                           // rising set: feet on rod k
      const map = (x, y) => [x, y + rodY[k] + ds[k].off];
      inlayAppend(out, inlayMemberSetMesh(ds[k]), map);
      pulls[k].filter(p => p.set === 'rising').forEach(p =>
        inlayAppend(out, pullRodMesh(ds[k], p.anchor === 'left', p.cps, p.y), map));
    }
    if (k > 0) {                           // dropping set: 180°, feet on rod k
      const map = (x, y) => [-x, rodY[k] - ds[k - 1].off - y];
      inlayAppend(out, inlayMemberSetMesh(ds[k - 1]), map);
      /* map negates x → a GLOBAL right anchor is a LOCAL left anchor */
      pulls[k - 1].filter(p => p.set === 'dropping').forEach(p =>
        inlayAppend(out, pullRodMesh(ds[k - 1], p.anchor !== 'left', p.cps, p.y), map));
    }
  }
  /* BED-CONTACT PASS (print rule §7f) — the whole body's bottom plane is at
   * z = −plateDepth/2 (plate underside, rod tangents, knob bases, compressing
   * rods, incl. the 180°-flipped dropping sets, whose map preserves z). Lift
   * uniformly so the bottom-most points sit exactly ON z = 0, matching §7g. */
  const zLift = S.plateDepth / 2;
  for (let i = 2; i < out.length; i += 3) out[i] += zLift;
  return out;
}

function meshToSTL(tris) {
  const n = tris.length / 9;
  const buf = new ArrayBuffer(84 + n * 50), dv = new DataView(buf);
  const hdr = 'KnitTex tool (mm)';
  for (let i = 0; i < hdr.length; i++) dv.setUint8(i, hdr.charCodeAt(i));
  dv.setUint32(80, n, true);
  let o = 84;
  for (let t = 0; t < n; t++) {
    const b = t * 9;
    const ax = tris[b], ay = tris[b+1], az = tris[b+2], bx = tris[b+3], by = tris[b+4], bz = tris[b+5], cx = tris[b+6], cy = tris[b+7], cz = tris[b+8];
    let nx = (by-ay)*(cz-az)-(bz-az)*(cy-ay), ny = (bz-az)*(cx-ax)-(bx-ax)*(cz-az), nz = (bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
    const l = Math.hypot(nx, ny, nz) || 1;
    dv.setFloat32(o, nx/l, true); dv.setFloat32(o+4, ny/l, true); dv.setFloat32(o+8, nz/l, true);
    dv.setFloat32(o+12, ax, true); dv.setFloat32(o+16, ay, true); dv.setFloat32(o+20, az, true);
    dv.setFloat32(o+24, bx, true); dv.setFloat32(o+28, by, true); dv.setFloat32(o+32, bz, true);
    dv.setFloat32(o+36, cx, true); dv.setFloat32(o+40, cy, true); dv.setFloat32(o+44, cz, true);
    dv.setUint16(o+48, 0, true); o += 50;
  }
  return new Uint8Array(buf);   // raw STL bytes — consumed by the ToolKit ZIP (§7h)
}

/* Master build: gate (SHARED with preview) → pre-set-condition gate (§7f.1)
 * → chain detection → export items. TRs are sorted bottom→top; consecutive
 * TRs whose TPU bands coincide (rowStart_upper = rowStart_lower +
 * height_lower + 2) join one chain. Pulling rods (§7f.1) are derived per TR
 * FIRST — for beam frames their crease levels also define the eyelet
 * arm/ring lines fed into inlayDerive. */
function buildInlayExport(model, builtTRs) {
  if (!Object.keys(model.tus).length)
    return { ok: false, reason: 'Nothing is placed on the canvas yet.' };
  const gate = foldGate(model, builtTRs);
  if (!gate.ok) return { ok: false, reason: gate.reason };
  /* PRE-SET CONDITION GATE (§7f.1) — same beam scale + diagonal step per TR. */
  const beamErr = inlayBeamConditionError(builtTRs);
  if (beamErr) return { ok: false, reason: beamErr };
  const sorted = [...builtTRs].sort((a, b) => a.rowStart - b.rowStart);
  const chains = [];
  for (const tr of sorted) {
    const last = chains[chains.length - 1];
    if (last && tr.rowStart === last.top.rowStart + last.top.height + 2) {
      last.trs.push(tr); last.top = tr;
    } else {
      chains.push({ trs: [tr], top: tr });
    }
  }
  return {
    ok: true,
    items: chains.map(ch => {
      const S = PRINT_SPEC;
      const C = ch.trs[0].width;             // every valid TR spans the canvas
      const pulls = ch.trs.map(tr => pullRodsForTR(tr));            // §7f.1
      const ds = ch.trs.map(tr => {
        const beam = trBeamInfo(tr);
        if (!beam) return inlayDerive(tr.height, C);
        return inlayDerive(tr.height, C,
          { cap: beam.cap, armLines: [0, -2 * beam.cap] });
      });
      const pullCount = pulls.reduce((s, a) => s + a.length, 0);    // §7f.1
      const pullRodsMeta = [];                                      // §7f.1
      pulls.forEach(arr => arr.forEach(p => pullRodsMeta.push({
        len: pullRodLength(C, Math.max(...p.cps)),
        bars: p.cps.length,
      })));
      /* rise = outer-to-outer of the end rods: Ø + the sum of rod spacings. */
      let rise = S.compressingRodDia;
      ds.forEach(d => { rise += 2 * d.rc; });
      const it = {
        trIds: ch.trs.map(t => t.TRid),
        Rs: ch.trs.map(t => t.height),
        C, ds, pulls, pullCount, pullRodsMeta,                      // §7f.1
        bodies: ch.trs.length + 1,
        shared: ch.trs.length > 1,
        outerSpan: ds[0].outerSpan,
        rise,                                // bottom rod outer → top rod outer
      };
      return it;
    }),
  };
}


/* ---------------------------------------------------------------------------
 * §7g · LOOP RETAINER EXPORT MODEL  (Model — pure JS; no React, no editor state)
 * ---------------------------------------------------------------------------
 * Generates the loop-retainer knitting tool as binary STL (units: mm). Every
 * TUBox needs TWO retainers. Export granularity is ONE PLATE PER TR: the file
 * `KnitTex_LoopRetainer_TR<n>.stl` contains the EXACT number of retainer
 * bodies that TR needs, already laid out for printing — users never multiply.
 *
 * PLATE LAYOUT: instances stack bottom-to-top (+y), smaller column counts
 * first, every instance left-aligned to x = 0, with RETAINER_PLATE_GAP (5 mm)
 * of clearance between bounding boxes. Instance height varies (the locking
 * rod climbs with its length), so extents are measured off the actual mesh,
 * never assumed.
 *
 * FORMULAS (span = (cols − 1) · needlePitch):
 *   baseRodLength    = endFront(1) + loopOffset(3) + span + endBack(2)
 *   lockingRodLength = span + endBack(2) + lockMargin(2.2)   (straight run)
 *
 * GEOMETRY — decoded from the reference DXF (frame: x along the bar, y up in
 * the loop plane, z depth; all tubes Ø1 with center plane z = 0.5):
 *   • BASE BAR    — ONE constant profile extruded the full length: rectangle
 *                   y 0→2 with sharp bottom corners, the two top edges
 *                   rounded by two arcs r = barArcR centered at
 *                   (y = 1 ∓ barArcOff, z = barArcRise), meeting at a
 *                   top-center seam (z = 2.0), peak z = 2.0429 — plus a Ø1
 *                   BORE along the whole length at (y = 1, z = 1). End faces
 *                   are the flat profile with the hole open.
 *   • LOOPS       — Ω/balloon centerlines in the z = 0…1 slab: legs rise
 *                   from the bar top at ±legHalfGap, splaying smoothly
 *                   OUTWARD (vertical-tangent Bézier blends) into a circular
 *                   head r = headRadius whose inner apex sits
 *                   loopInnerHeight (5) above the bar top. Legs embed only
 *                   `embed` (0.4) — deeper would breach the bore wall.
 *   • LOCKING ROD — vertical rise on the bar front (axis endFront from the
 *                   face), FILLETED bend (r = bendRadius, 62.5°) starting
 *                   bendRise above the bar top, straight run at 117.5° from
 *                   vertical, 180° tip hook (r = hookRadius) curling
 *                   up-left, ending in a HEMISPHERICAL dome cap.
 *   Components overlap and union at slicing time (same multi-solid STL
 *   practice as §7f).
 *
 * GATING — none of its own: §14e derives retainers only after
 * buildInlayExport (§7f) reports ok, so the SAME foldGate applies. Never
 * duplicated here.
 * DELETE-SAFETY — nothing else reads this section; removing it only requires
 * removing the marked RETAINER TOUCHPOINT lines in §14e (and the retainer
 * lines in §7h's toolkitDownload).
 * -------------------------------------------------------------------------*/

const RETAINER_SPEC = {
  rodDia:     1.0,     // Ø of every tube (loops, vertical + locking rod)
  barHeight:  2.0,     // bar profile height (y)
  boreR:      0.5,     // Ø1 bore along the bar at (y = 1, z = 1)
  barArcR:    0.7866,  // top-edge rounding arcs…
  barArcOff:  0.25625, //   …centers at (y = 1 ∓ barArcOff, z = barArcRise)
  barArcRise: 1.25625, //   (seam at z = 2.0, peaks at z = 2.0429)
  endFront:   1.0,     // front face → vertical-rod axis
  loopOffset: 3.0,     // vertical-rod axis → first loop center
  endBack:    2.0,     // last loop center → back face
  embed:      0.4,     // leg/rod embedment below the bar top (bore-safe: <0.5)
  legHalfGap:      0.6175,  // loop center → leg centerline at the bar top
  headRadius:      1.1423,  // loop head centerline radius
  loopInnerHeight: 5.0,     // bar top → loop inner apex (drawing "5mm")
  legLowerCtrl: 0.58,  // leg Bézier control lengths (fraction of leg rise):
  legUpperCtrl: 0.42,  //   longer at the bottom → straighter lower leg (per DXF)
  bendRise:   4.913,   // bar top → bend-fillet start on the vertical rod
  bendRadius: 1.0,     // bend fillet centerline radius (62.5° sweep)
  lockAngle:  117.5,   // vertical rod → locking rod, degrees
  lockMargin: 2.2,     // straight-run length margin beyond the loop span
  hookRadius: 1.0,     // 180° tip hook centerline radius
  SEG_TUBE: 12, SEG_BEZ: 10, SEG_ARC: 16, SEG_FILLET: 8,
  SEG_DOME: 5, SEG_BAR: 48,
};

const RETAINER_PLATE_GAP = 5;   // mm clearance between stacked instances

/* Pure size derivation — keeps the drawing's segment decomposition symbolic.
 * Reference check (cols = 7): baseRodLength 33, straight run ≈ 31.2 — both
 * match the reference DXF's extents. */
function retainerDerive(cols) {
  const S = RETAINER_SPEC;
  const span = (cols - 1) * PRINT_SPEC.needlePitch;
  return {
    cols,
    baseRodLength:    S.endFront + S.loopOffset + span + S.endBack,
    lockingRodLength: span + S.endBack + S.lockMargin,
  };
}

/* Aggregation: PER TR. Each entry drives one plate file; `sizes` lists the
 * distinct retainer sizes (2 per TU box, identical sizes merged) that will be
 * physically instanced onto that TR's plate. Column count is the TU's built
 * boxWidth (authoritative for ALL TU types — TU4–TU7 have no `width` param).
 * Caller gates via buildInlayExport().ok (§7f). */
function buildRetainerExport(builtTRs) {
  return builtTRs.map(tr => {
    const counts = new Map();                          // cols → instance qty
    tr._builds.forEach(b =>
      counts.set(b.boxWidth, (counts.get(b.boxWidth) || 0) + 2));
    return {
      tr: tr.TRid,
      sizes: [...counts.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([cols, qty]) => ({ ...retainerDerive(cols), qty })),
    };
  });
}

/* Sweep a circular tube of radius r along a planar (x–y) centerline whose
 * center plane sits at z = zc. Planar paths admit a torsion-free frame:
 * u = in-plane left normal of the (vertex-averaged) tangent, v = +z. Lateral
 * quads wind outward. Start gets a flat fan cap (always embedded); the end
 * gets a flat cap, or a HEMISPHERICAL dome when domeEnd (free hook tip). */
function retainerTube(out, pts, r, seg, zc, domeEnd = false) {
  const n = pts.length;
  const dir = (i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const l = Math.hypot(tx, ty) || 1;
    return [tx / l, ty / l];
  };
  const ringAt = (cx, cy, rr, [tx, ty]) => {
    const R = [];
    for (let j = 0; j < seg; j++) {
      const th = 2 * Math.PI * j / seg, c = rr * Math.cos(th), s = rr * Math.sin(th);
      R.push([cx - c * ty, cy + c * tx, zc + s]);
    }
    return R;
  };
  const stitch = (A, B) => {
    for (let j = 0; j < seg; j++) {
      const j1 = (j + 1) % seg, a0 = A[j], a1 = A[j1], b0 = B[j], b1 = B[j1];
      out.push(a0[0], a0[1], a0[2], a1[0], a1[1], a1[2], b1[0], b1[1], b1[2]);
      out.push(a0[0], a0[1], a0[2], b1[0], b1[1], b1[2], b0[0], b0[1], b0[2]);
    }
  };
  const fan = (c, R, flip) => {
    for (let j = 0; j < seg; j++) {
      const a = R[j], b = R[(j + 1) % seg];
      if (flip) out.push(c[0], c[1], c[2], b[0], b[1], b[2], a[0], a[1], a[2]);
      else      out.push(c[0], c[1], c[2], a[0], a[1], a[2], b[0], b[1], b[2]);
    }
  };
  let prev = ringAt(pts[0][0], pts[0][1], r, dir(0));
  fan([pts[0][0], pts[0][1], zc], prev, true);                // start cap
  for (let i = 1; i < n; i++) {
    const cur = ringAt(pts[i][0], pts[i][1], r, dir(i));
    stitch(prev, cur);
    prev = cur;
  }
  const e = pts[n - 1], t = dir(n - 1);
  if (!domeEnd) { fan([e[0], e[1], zc], prev, false); return; }
  const M = RETAINER_SPEC.SEG_DOME;                           // dome: shrinking
  for (let m = 1; m < M; m++) {                               // rings advancing
    const ph = (Math.PI / 2) * m / M;                         // along the tangent
    const cur = ringAt(e[0] + t[0] * r * Math.sin(ph), e[1] + t[1] * r * Math.sin(ph),
                       r * Math.cos(ph), t);
    stitch(prev, cur);
    prev = cur;
  }
  fan([e[0] + t[0] * r, e[1] + t[1] * r, zc], prev, false);   // apex
}

/* Cubic Bézier with BOTH end tangents vertical (control x = end x); c0y/c1y
 * are the absolute y's of the two control points. Appends n points (skips t=0). */
function retainerBez(pts, xa, ya, c0y, xb, yb, c1y, n) {
  for (let i = 1; i <= n; i++) {
    const t = i / n, mt = 1 - t;
    pts.push([
      xa * mt * mt * (1 + 2 * t) + xb * t * t * (3 - 2 * t),
      ya * mt * mt * mt + c0y * 3 * t * mt * mt + c1y * 3 * t * t * mt + yb * t * t * t,
    ]);
  }
}

/* Ω-loop centerline for a loop centered at cx (see header). */
function retainerLoopPath(cx) {
  const S = RETAINER_SPEC;
  const y0 = S.barHeight;                                    // legs start at the bar top
  const R = S.headRadius;
  const cH = y0 + S.loopInnerHeight + S.rodDia / 2 - R;      // head-center height
  const L = cH - y0;
  const g = S.legHalfGap;
  const pts = [[cx - g, y0 - S.embed], [cx - g, y0]];        // embedded start
  retainerBez(pts, cx - g, y0, y0 + S.legLowerCtrl * L, cx - R, cH, cH - S.legUpperCtrl * L, S.SEG_BEZ);
  for (let i = 1; i <= S.SEG_ARC; i++) {                     // head: 180° over the top
    const a = Math.PI - Math.PI * i / S.SEG_ARC;
    pts.push([cx + R * Math.cos(a), cH + R * Math.sin(a)]);
  }
  retainerBez(pts, cx + R, cH, cH - S.legUpperCtrl * L, cx + g, y0, y0 + S.legLowerCtrl * L, S.SEG_BEZ);
  pts.push([cx + g, y0 - S.embed]);                          // embedded end
  return pts;
}

/* Locking-rod centerline: embedded vertical rise, filleted 62.5° bend,
 * straight run of length L at lockAngle from vertical, 180° tip hook. */
function retainerLockPath(L) {
  const S = RETAINER_SPEC;
  const xv = S.endFront;
  const yb = S.barHeight + S.bendRise;                       // fillet start height
  const el = (S.lockAngle - 90) * Math.PI / 180;             // elevation above horizontal
  const turn = (180 - S.lockAngle) * Math.PI / 180;          // 62.5°
  const pts = [[xv, S.barHeight - S.embed], [xv, yb]];       // embedded vertical run
  const fc = [xv + S.bendRadius, yb];                        // fillet center
  for (let i = 1; i <= S.SEG_FILLET; i++) {
    const a = Math.PI - turn * i / S.SEG_FILLET;
    pts.push([fc[0] + S.bendRadius * Math.cos(a), fc[1] + S.bendRadius * Math.sin(a)]);
  }
  const dx = Math.cos(el), dy = Math.sin(el);

 * download time (the dialog only lists metadata). */

    const notationSVG =

    const files = [];

    inlays.forEach(it => files.push({
      name: `KnitTex_ToolKit/KnitTex_TPUInlay_TR${it.trIds.join('+')}.stl`,
      data: meshToSTL(inlayChainMesh(it)),

    retainers.forEach(t => files.push({
      name: `KnitTex_ToolKit/KnitTex_LoopRetainer_TR${t.tr}.stl`,
      data: meshToSTL(retainerPlateMesh(t)),
    }));

    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    console.error('KnitTex export failed:', err);

    alert(
      'The toolkit could not be exported because one or more stitch images ' +
      'could not be loaded.\n\n' +
      (err && err.message ? err.message : String(err))

  }
