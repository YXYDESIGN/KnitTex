/* §4 · FOLD GEOMETRY PRIMITIVES ------------------------------------------- */
class Fold {
  constructor(spec) { Object.assign(this, spec); }
  get foldClass() { throw new Error('abstract'); }
  get foldClassName() { return FOLDCLASS_NAME[this.foldClass]; }
  get ftypeName() { return FTYPE_NAME[this.FType]; }
  shapeError() { return ''; }
  cells() { return []; }
}

class HFold extends Fold {
  get foldClass() { return 'H'; }
  midRow(gridRowStart) { return gridRowStart + 1; }
  snapPoint(gridRowStart, x) { return { x, y: this.midRow(gridRowStart) - 0.5 }; }
  shapeError() { return this.width < 2 ? 'Please keep horizontal crease >= 2' : ''; }
  cells(colStart, rowStart) {
    const out = [];
    for (let r = 1; r <= 3; r++) for (let c = 1; c <= this.width; c++) out.push({ gridCol: colStart + c - 1, gridRow: rowStart + r - 1 });
    return out;
  }
  crease(colStart, rowStart) {
    const midY = this.midRow(rowStart) - 0.5;
    return { p1: { x: colStart - 1, y: midY }, p2: { x: colStart + this.width - 1, y: midY }, dashed: this.FType === 2, role: CREASE_ROLE.FOLD };
  }
}

class VFold extends Fold {
  get foldClass() { return 'V'; }
  shapeError() { return this.height < 2 ? 'Please keep vertical creases >= 2' : ''; }
  cells(colStart, rowStart) {
    const out = [];
    for (let r = 1; r <= this.height; r++) out.push({ gridCol: colStart, gridRow: rowStart + r - 1 });
    return out;
  }
}

class DFold extends Fold {
  get foldClass() { return 'D'; }
  shapeError() { return this.width < 3 ? 'Please keep diagonal crease widths >= 3' : ''; }
  cells(colStart, rowStart) {
    const out = [], W = this.width, S = this.FSlope, seen = new Set();
    const add = (c, r) => { const k = c + '_' + r; if (seen.has(k)) return; seen.add(k); out.push({ gridCol: colStart + c - 1, gridRow: rowStart + r - 1 }); };
    for (let i = 0; i < W - 1; i++) for (let r = i * S + 1; r <= (i + 1) * S; r++) {
      if (this.FDirect === 'BL2TR') { add(i + 1, r); add(i + 2, r); }
      else { add(W - i, r); add(W - i - 1, r); }
    }
    return out;
  }
  endpoints(colStart, rowStart) {
    const W = this.width, topRow = rowStart + this.height - 1;
    if (this.FDirect === 'BL2TR') return { botCell: colStart, botX: colStart - 1, topCell: colStart + W - 1, topX: colStart + W - 1, botRow: rowStart, topRow };
    return { botCell: colStart + W - 1, botX: colStart + W - 1, topCell: colStart, topX: colStart - 1, botRow: rowStart, topRow };
  }
  crease(colStart, rowStart, info = {}) {
    const W = this.width, topRow = rowStart + this.height - 1;
    let p1, p2;
    if (this.FDirect === 'BL2TR') { p1 = { x: colStart - 1, y: rowStart - 0.5 }; p2 = { x: colStart + W - 1, y: topRow - 0.5 }; }
    else { p1 = { x: colStart - 1, y: topRow - 0.5 }; p2 = { x: colStart + W - 1, y: rowStart - 0.5 }; }
    if (this.FDirect === 'BL2TR') { if (info.snapBottom) p1 = info.snapBottom; if (info.snapTop) p2 = info.snapTop; }
    else { if (info.snapBottom) p2 = info.snapBottom; if (info.snapTop) p1 = info.snapTop; }
    return { p1, p2, dashed: this.FType === 6, role: CREASE_ROLE.FOLD };
  }
}

class TFold extends Fold {
  get foldClass() { return 'T'; }
  cells(colStart, rowStart) {
    const out = [];
    for (let r = 1; r <= 2; r++) for (let c = 1; c <= this.width; c++) out.push({ gridCol: colStart + c - 1, gridRow: rowStart + r - 1 });
    return out;
  }
  crease(colStart, rowStart) {
    return { p1: { x: colStart - 1, y: rowStart }, p2: { x: colStart + this.width - 1, y: rowStart }, dashed: false, role: CREASE_ROLE.TPU };
  }
}

class VCreaseGroup {
  constructor(spec) { Object.assign(this, spec); }
  get centerX() { return (this.cMin - 1 + this.cMax) / 2; }
  crease() {
    const cx = this.centerX;
    const resolve = (snap, flushY, extendY) =>
      (snap && typeof snap === 'object') ? snap
        : snap === 'extend' ? { x: cx, y: extendY }
          : { x: cx, y: flushY };
    const p1 = resolve(this.snapBottom, this.rowBot - 1, this.rowBot - 2.5);
    const p2 = resolve(this.snapTop, this.rowTop, this.rowTop + 1.5);
    return { p1, p2, dashed: this.FType === 4, role: CREASE_ROLE.FOLD };
  }
}


/* §5 · TEXTURE-UNIT CATALOG ----------------------------------------------- */
class TUType {
  get type() { throw new Error('abstract'); }
  get name() { throw new Error('abstract'); }
  get paramFields() { return []; }
  defaults() { throw new Error('abstract'); }
  clamp(params) { return params; }
  build(params) { throw new Error('abstract'); }
  validate(folds, W, H) {
    const seen = new Set();
    let ok = true, err = '';
    for (const f of folds) {
      const se = f.shapeError();
      if (se) { ok = false; err = se; }
      for (const c of f.cells(f.FColStart, f.FRowStart)) {
        if (c.gridCol < 1 || c.gridCol > W || c.gridRow < 1 || c.gridRow > H) { ok = false; err = 'fold out of Texture Unit'; }
        const k = key(c.gridCol, c.gridRow);
        if (seen.has(k)) { ok = false; err = 'fold creases overlap'; }
        seen.add(k);
      }
    }
    return { ok, err };
  }
}

class TriPrismType extends TUType {
  get type() { return 'TU1'; }
  get name() { return 'TriPrism'; }
  get paramFields() {
    return [
      { key: 'width', label: 'Width', control: 'number', min: 2 },
      { key: 'height', label: 'Height', control: 'number', min: 3 },
      { key: 'edgePosit', label: 'Edge position', hint: '≥ 2 due to stitch structures', control: 'number', min: 2 },
      { key: 'side', label: 'Texture side', control: 'select', options: [['front', 'front'], ['back', 'back']] },
    ];
  }
  defaults() { return { width: 7, height: 15, edgePosit: 8, side: 'front' }; }
  clamp(p) {
    const q = { ...p };
    q.width = clampN(q.width, 2, FabricCol);
    q.height = clampN(q.height, 2, FabricRow);
    q.edgePosit = clampN(q.edgePosit, 2, Math.max(2, q.height - 1));
    return q;
  }
  build(p) {
    const { width, height, edgePosit, side } = p;
    const folds = [new HFold({ Fid: 1, FType: side === 'front' ? 1 : 2, FColStart: 1, FRowStart: edgePosit - 1, width, height: 3 })];
    const { ok, err } = this.validate(folds, width, height);
    return { folds, boxWidth: width, boxHeight: height, isValid: ok, err };
  }
}

class PyramidType extends TUType {
  get type() { return 'TU2'; }
  get name() { return 'Pyramid'; }
  get paramFields() {
    return [
      { key: 'width', label: 'Width', control: 'number', min: 2 },
      { key: 'height', label: 'Height', control: 'number', min: 7 },
      { key: 'surfaceScale', label: 'Surface scale', hint: '≥ 3 due to stitch structures', control: 'number', min: 3 },
      { key: 'edgePosit', label: 'Edge position', hint: '≥ 2 due to stitch structures', control: 'number', min: 2 },
      { key: 'side', label: 'Texture side', control: 'select', options: [['front', 'front'], ['back', 'back']] },
    ];
  }
  defaults() { return { width: 7, height: 15, edgePosit: 6, surfaceScale: 4, side: 'front' }; }
  clamp(p) {
    const q = { ...p };
    q.width = clampN(q.width, 2, FabricCol);
    q.height = clampN(q.height, 2, FabricRow);
    q.surfaceScale = clampN(q.surfaceScale, 3, Math.min(q.surfaceScale, q.height - 3));
    q.edgePosit = clampN(q.edgePosit, 2, Math.min(q.edgePosit, q.height - 1 - q.surfaceScale));
    return q;
  }
  build(p) {
    const { width, height, edgePosit, surfaceScale, side } = p;
    const sideE = side === 'front' ? 1 : 2;
    const folds = [
      new HFold({ Fid: 1, FType: sideE, FColStart: 1, FRowStart: edgePosit - 1, width, height: 3 }),
      new HFold({ Fid: 2, FType: sideE, FColStart: 1, FRowStart: edgePosit - 1 + surfaceScale, width, height: 3 }),

    const { ok, err } = this.validate(folds, width, height);
    return { folds, boxWidth: width, boxHeight: height, isValid: ok, err };
  }
}

      { key: 'prismPosition', label: 'Prism position', control: 'select', options: [['bottom', 'bottom'], ['top', 'top']] },
      { key: 'prismScale', label: 'Prism scale', hint: '≥ 5 due to stitch structures', control: 'number', min: 2 },
      { key: 'edgePosit', label: 'Edge position', hint: '≥ 2 due to stitch structures', control: 'number', min: 2 },
      { key: 'side', label: 'Texture side', control: 'select', options: [['front', 'front'], ['back', 'back']] },
    ];
  }
  defaults() { return { width: 7, height: 15, prismScale: 10, edgePosit: 5, prismPosition: 'bottom', side: 'front' }; }
  clamp(p) {
    const q = { ...p };
    q.width = clampN(q.width, 2, FabricCol);
    q.height = clampN(q.height, 2, FabricRow);
    q.edgePosit = clampN(q.edgePosit, 2, Math.min(q.edgePosit, q.prismScale - 3));
    q.prismScale = clampN(q.prismScale, 5, Math.min(q.prismScale, q.height - 1));
    return q;
  }
  build(p) {
    const { width, height, prismScale, edgePosit, prismPosition, side } = p;
    const isBottom = prismPosition === 'bottom';
    const edge = isBottom ? edgePosit : height + 1 - edgePosit;
    const scale = isBottom ? prismScale : height + 1 - prismScale;
    const sideE = side === 'front' ? 1 : 2, sideS = side === 'front' ? 2 : 1;
    const folds = [
      new HFold({ Fid: 1, FType: sideE, FColStart: 1, FRowStart: edge - 1, width, height: 3 }),
      new HFold({ Fid: 2, FType: sideS, FColStart: 1, FRowStart: scale - 1, width, height: 3 }),
    ];
    const { ok, err } = this.validate(folds, width, height);
    return { folds, boxWidth: width, boxHeight: height, isValid: ok, err };
  }
}

    ];

  defaults() { return { diagonalStep: 6, spikeAlignment: 2, spikeSlope: 1, side: 'front' }; }
  clamp(p) {
    const q = { ...p };
    q.spikeAlignment = clampN(q.spikeAlignment, -1, 2);
    q.spikeSlope = clampN(q.spikeSlope, 1, 3);

/* §6 · PLACED ENTITIES ---------------------------------------------------- */
class PlacedTU {
  constructor({ id, type, params, colStart, rowStart }) {
    this.id = id; this.type = type; this.params = params; this.colStart = colStart; this.rowStart = rowStart;
  }
  get tuType() { return TU_TYPES[this.type]; }
  get name() { return this.tuType.name; }
  build() { return this.tuType.build(this.params); }
  withParams(params) { return new PlacedTU({ id: this.id, type: this.type, params, colStart: this.colStart, rowStart: this.rowStart }); }
}

class TR {
  constructor(TRid, tuList) {
    this.TRid = TRid;
    this.tus = tuList.slice().sort((a, b) => a.colStart - b.colStart);
    const builds = this.tus.map(t => t.build());
    this.width  = builds.reduce((s, b) => s + b.boxWidth, 0);
    this.height = builds.length ? builds[0].boxHeight : 0;
    this.colStart = this.tus.length ? this.tus[0].colStart : 0;
    this.rowStart = this.tus.length ? this.tus[0].rowStart : 0;
    this._builds = builds;
  }
  get colMin() { return this.colStart + 1; }
  get colMax() { return this.colStart + this.width; }
  get rowMin() { return this.rowStart + 1; }
  get rowMax() { return this.rowStart + this.height; }
  get membersValid()  { return this._builds.every(b => b.isValid); }
  get spansCanvas()   { return this.width === FabricCol; }
  get heightsEqual()  { return this._builds.every(b => b.boxHeight === this.height); }
  get rowStartsEqual(){ return this.tus.every(t => t.rowStart === this.rowStart); }
  outofCanvas() {
    return this.colMin < 1 || this.colMax > FabricCol ||
           this.rowMin < 1 || this.rowMax > FabricRow;
  }
  overlapsOtherTRs(others) {
    return others.some(o =>
      o !== this &&
      this.colMin <= o.colMax && o.colMin <= this.colMax &&
      this.rowMin <= o.rowMax && o.rowMin <= this.rowMax
    );
  }
  tBands() { return [this.rowStart - 1, this.rowStart + this.height + 1]; }
  tHalfOverlaps(others = []) {
    const mine = this.tBands();
    for (const o of others) {
      if (o === this || o.order >= this.order) continue;
      if (!o.baseValid(others)) continue;
      for (const a of mine) for (const b of o.tBands())
        if (Math.abs(a - b) === 1) return true;
    }
    return false;
  }
  baseValid(others = []) {
    return this.tus.length > 0 &&
           this.membersValid &&
           this.spansCanvas &&
           this.heightsEqual &&
           this.rowStartsEqual &&
           !this.outofCanvas() &&
           !this.overlapsOtherTRs(others);
  }
  isValid(others = []) {
    return this.baseValid(others) && !this.tHalfOverlaps(others);
  }
  validityReport(others = []) {
    const checks = [
      [this.tus.length > 0,             'no TUs'],
      [this.membersValid,              'a member TU is invalid'],
      [this.spansCanvas,               `width ${this.width} ≠ canvas ${FabricCol}`],
      [this.heightsEqual,              'member heights differ'],
      [this.rowStartsEqual,            'member rowStarts differ'],
      [!this.outofCanvas(),            'out of canvas'],
      [!this.overlapsOtherTRs(others), 'overlaps another TR'],
      [!this.tHalfOverlaps(others),    'TPU inlay collides with an adjacent TR'],
    ];
    return { valid: checks.every(c => c[0]), reasons: checks.filter(c => !c[0]).map(c => c[1]) };
  }
  static buildAll(trMeta, tus) {
    const built = trMeta
      .map((m, idx) => {
        const tr = new TR(null, m.tus.map(id => tus[id]).filter(Boolean));
        tr.srcId = m.TRid;
        tr.order = idx;
        return tr;
      })
      .filter(tr => tr.tus.length);
    built.sort((a, b) => a.rowStart - b.rowStart);
    built.forEach((tr, i) => { tr.TRid = i + 1; });
    built.forEach(tr => { tr.tus.forEach((tu, j) => { tu.TUid = j + 1; }); });
    return built;
  }
}


/* §7 · SPATIAL & GEOMETRY SERVICES ---------------------------------------- */
const rectOf = (colStart, rowStart, b) => ({
  cMin: colStart + 1,          rMin: rowStart + 1,
  cMax: colStart + b.boxWidth, rMax: rowStart + b.boxHeight,
});
const rectFits = (r) =>
  r.cMin >= 1 && r.cMax <= FabricCol &&
  r.rMin >= 1 + T_MARGIN && r.rMax <= FabricRow - T_MARGIN;
const rectsOverlap = (a, b) =>
  a.cMin <= b.cMax && b.cMin <= a.cMax && a.rMin <= b.rMax && b.rMin <= a.rMax;
const rectHitsT = (r, tCells) => {
  for (let c = r.cMin; c <= r.cMax; c++)
    for (let rr = r.rMin; rr <= r.rMax; rr++)
      if (tCells.has(key(c, rr))) return true;
  return false;
};

function canPlace(build, colStart, rowStart, tus, tCells, excludeId = null) {
  if (!build.isValid) return false;
  const r = rectOf(colStart, rowStart, build);
  if (!rectFits(r)) return false;
  for (const oid in tus) {
    if (oid === excludeId) continue;
    const o = tus[oid];
    if (rectsOverlap(r, rectOf(o.colStart, o.rowStart, o.build()))) return false;
  }
  return !rectHitsT(r, tCells);
}

function computeTCells(builtTRs = []) {
  const s = new Set();
  const inGrid = (c, r) => c >= 1 && c <= FabricCol && r >= 1 && r <= FabricRow;
  for (const tr of builtTRs) {
    if (!tr.isValid(builtTRs)) continue;
    const gcol = tr.colStart + 1;
    for (const rs of [tr.rowStart - 1, tr.rowStart + tr.height + 1]) {
      const fold = new TFold({ Fid: 0, FType: 7, FColStart: 1, FRowStart: 1, width: tr.width, height: 2 });
      for (const c of fold.cells(gcol, rs))
        if (inGrid(c.gridCol, c.gridRow)) s.add(key(c.gridCol, c.gridRow));
    }
  }
  return s;
}

function pruneTUsUnderT(tus, tCellSet, keepIds = new Set()) {
  const next = {};
  for (const id in tus) {
    if (keepIds.has(id)) { next[id] = tus[id]; continue; }
    const t = tus[id], b = t.build();
    let hit = false;
    for (let c = 0; c < b.boxWidth && !hit; c++)
      for (let r = 0; r < b.boxHeight && !hit; r++)
        if (tCellSet.has(key(t.colStart + 1 + c, t.rowStart + 1 + r))) hit = true;
    if (!hit) next[id] = t;
  }
  return next;
}

function computeGeometry(tus, built, builtTRs = []) {
  const inGrid = (c, r) => c >= 1 && c <= FabricCol && r >= 1 && r <= FabricRow;

  const cellFType = new Map();
  for (let c = 1; c <= FabricCol; c++)
    for (let r = 1; r <= FabricRow; r++)
      cellFType.set(key(c, r), 8);

  const gridFolds = [];
  for (const id in tus) {
    const tu = tus[id], m = built[id];
    for (const fold of m.folds) gridFolds.push({ fold, gridColStart: tu.colStart + fold.FColStart, gridRowStart: tu.rowStart + fold.FRowStart, ownerTU: id, isValid: m.isValid });
  }

  const foldColor = new Map(), boxSet = new Set(), ownerMap = new Map();
  for (const id in tus) {
    const tu = tus[id], m = built[id];
    for (let c = 0; c < m.boxWidth; c++) for (let r = 0; r < m.boxHeight; r++) {
      const gc = tu.colStart + 1 + c, gr = tu.rowStart + 1 + r;
      if (inGrid(gc, gr)) { boxSet.add(key(gc, gr)); ownerMap.set(key(gc, gr), id); }
    }
  }
  for (const gf of gridFolds)
    for (const c of gf.fold.cells(gf.gridColStart, gf.gridRowStart))
      if (inGrid(c.gridCol, c.gridRow)) {
        foldColor.set(key(c.gridCol, c.gridRow), { foldClass: gf.fold.foldClass, ownerTU: gf.ownerTU });
        cellFType.set(key(c.gridCol, c.gridRow), gf.fold.FType);
      }

  const hFoldAt = new Map();
  for (const gf of gridFolds) if (gf.fold.foldClass === 'H' && gf.isValid)
    for (const c of gf.fold.cells(gf.gridColStart, gf.gridRowStart))
      hFoldAt.set(key(c.gridCol, c.gridRow), gf);
  const findH = (c, r) => hFoldAt.get(key(c, r)) || null;

  const snapMap = new Map(), dInfo = new Map();
  for (const gf of gridFolds) {
    const f = gf.fold; if (f.foldClass !== 'D' || !gf.isValid) continue;
    const e = f.endpoints(gf.gridColStart, gf.gridRowStart), info = {};
    const hB = findH(e.botCell, e.botRow - 1);
    if (hB) { const sp = hB.fold.snapPoint(hB.gridRowStart, e.botX); info.snapBottom = sp; snapMap.set(key(e.botCell, hB.fold.midRow(hB.gridRowStart)), sp); }
    const hT = findH(e.topCell, e.topRow + 1);
    if (hT) { const sp = hT.fold.snapPoint(hT.gridRowStart, e.topX); info.snapTop = sp; snapMap.set(key(e.topCell, hT.fold.midRow(hT.gridRowStart)), sp); }

    const otu = tus[gf.ownerTU], om = built[gf.ownerTU];
    if (otu && om) {
      const boxBotRow = otu.rowStart + 1;
      const boxTopRow = otu.rowStart + om.boxHeight;
      if (!info.snapBottom && e.botRow === boxBotRow) info.snapBottom = { x: e.botX, y: otu.rowStart };
      if (!info.snapTop    && e.topRow === boxTopRow) info.snapTop    = { x: e.topX, y: otu.rowStart + om.boxHeight };
    }
    dInfo.set(gf, info);
  }

  const creases = [];
  for (const gf of gridFolds) {
    const f = gf.fold; if (!gf.isValid) continue;
    if (f.foldClass === 'H' || f.foldClass === 'T') creases.push(f.crease(gf.gridColStart, gf.gridRowStart));
    else if (f.foldClass === 'D') creases.push(f.crease(gf.gridColStart, gf.gridRowStart, dInfo.get(gf) || {}));
  }

  const vFolds = gridFolds.filter(gf => gf.fold.foldClass === 'V' && gf.isValid)
    .map(gf => ({ ownerTU: gf.ownerTU, FType: gf.fold.FType, gridRowStart: gf.gridRowStart, height: gf.fold.height, gridColStart: gf.gridColStart }))
    .sort((a, b) => a.ownerTU.localeCompare(b.ownerTU) || a.FType - b.FType || a.gridRowStart - b.gridRowStart || a.height - b.height || a.gridColStart - b.gridColStart);
  const vPeers = [];
  for (const v of vFolds) {
    const last = vPeers[vPeers.length - 1];
    if (last && last.ownerTU === v.ownerTU && last.FType === v.FType && last.gridRowStart === v.gridRowStart && last.height === v.height && last.cMax + 1 === v.gridColStart) last.cMax = v.gridColStart;
    else vPeers.push({ ownerTU: v.ownerTU, FType: v.FType, gridRowStart: v.gridRowStart, height: v.height, cMin: v.gridColStart, cMax: v.gridColStart });
  }

  for (const g of vPeers) {
    const centerX = (g.cMin - 1 + g.cMax) / 2;
    const rowBot = g.gridRowStart, rowTop = g.gridRowStart + g.height - 1;
    const pickSnap = (Hmid) => {
      const s = [];
      for (let c = g.cMin; c <= g.cMax; c++) { const sp = snapMap.get(key(c, Hmid)); if (sp) s.push(sp); }
      if (!s.length) return 'extend';
      s.sort((a, b) => Math.abs(a.x - centerX) - Math.abs(b.x - centerX));
      return s[0];
    };
    const hB = (() => { for (let c = g.cMin; c <= g.cMax; c++) { const h = findH(c, rowBot - 1); if (h) return h; } return null; })();
    const hT = (() => { for (let c = g.cMin; c <= g.cMax; c++) { const h = findH(c, rowTop + 1); if (h) return h; } return null; })();
    const snapBottom = hB ? pickSnap(hB.fold.midRow(hB.gridRowStart)) : null;
    const snapTop = hT ? pickSnap(hT.fold.midRow(hT.gridRowStart)) : null;
    creases.push(new VCreaseGroup({ FType: g.FType, cMin: g.cMin, cMax: g.cMax, rowBot, rowTop, snapBottom, snapTop }).crease());
  }

  for (const tr of builtTRs) {
    if (!tr.isValid(builtTRs)) continue;
    const gcol = tr.colStart + 1;
    const specs = [
      { Fid: tr.TRid * 10 + 1, rowStart: tr.rowStart - 1 },
      { Fid: tr.TRid * 10 + 2, rowStart: tr.rowStart + tr.height + 1 },
    ];
    for (const s of specs) {
      const fold = new TFold({ Fid: s.Fid, FType: 7, FColStart: 1, FRowStart: 1, width: tr.width, height: 2 });
      for (const c of fold.cells(gcol, s.rowStart))
        if (inGrid(c.gridCol, c.gridRow)) {
          foldColor.set(key(c.gridCol, c.gridRow), { foldClass: 'T', ownerTU: null });
          cellFType.set(key(c.gridCol, c.gridRow), 7);
        }
      creases.push(fold.crease(gcol, s.rowStart));
    }
  }

  for (const id in tus) {
    const tu = tus[id], m = built[id];
    const xL = tu.colStart, xR = tu.colStart + m.boxWidth;
    const yBot = tu.rowStart, yTop = tu.rowStart + m.boxHeight;
    if (xL > 0)        creases.push({ p1: { x: xL, y: yBot }, p2: { x: xL, y: yTop }, dashed: false, role: CREASE_ROLE.BOUNDARY });
    if (xR < FabricCol) creases.push({ p1: { x: xR, y: yBot }, p2: { x: xR, y: yTop }, dashed: false, role: CREASE_ROLE.BOUNDARY });
  }

  const tCells = computeTCells(builtTRs);
  return { foldColor, boxSet, ownerMap, creases, cellFType, tCells };
}

/* Intentionally unreferenced — kept as a future per-TU placement-report API. */
function computePlacement(tus, built, tCells = new Set()) {
  const ids = Object.keys(tus);
  const out = {};
  for (const id of ids) {
    const b = built[id];
    if (!b) { out[id] = { outOfCanvas: false, overlapOtherTU: false, valid: false, err: 'not built' }; continue; }
    const t = tus[id];
    const r = rectOf(t.colStart, t.rowStart, b);
    const oob = !rectFits(r);
    let overlap = false;
    for (const o of ids) {
      if (o === id) continue;
      const ob = built[o]; if (!ob) continue;
      const q = rectOf(tus[o].colStart, tus[o].rowStart, ob);
      if (rectsOverlap(r, q)) { overlap = true; break; }
    }
    if (!overlap) overlap = rectHitsT(r, tCells);
    out[id] = {
      outOfCanvas: oob,
      overlapOtherTU: overlap,
      valid: b.isValid && !oob && !overlap,
      err: !b.isValid ? b.err : oob ? 'out of Texture Unit canvas' : overlap ? 'overlaps another TU' : '',
    };
  }
  return out;
}


/* ---------------------------------------------------------------------------
 * §7b · NOTATION MODEL
 * ---------------------------------------------------------------------------
 * Pure translation from the placed-fabric domain (TUs grouped into TRs) into a
 * `gridNotation` — a bottom-origin 2D array of stitch-operation cells.
 *
 * Layering, mirroring the described work flow:
 *   translateTUBox — one TU box → an expanded notation sub-grid (row insertions
 *                    for H/D folds, belowF resolved BEFORE the D side-cells are
 *                    stamped, then transRule side-cells, then value assignment,
 *                    then markDSpans flags the D-fold twist pairs).
 *   composeTR      — TUs of a TR laid out left→right; each TU's expanded height
 *                    reconciled against the running heightNotat (shorter TUs get
 *                    FType=null filler above); vertical seams flagged.
 *   composeT / P   — TPU-band strips and plain strips.
 *   buildNotation  — gates on validity, decomposes the canvas into full-width
 *                    strips (TRs never share a canvas row with plain/other TRs
 *                    because every valid TR spans FabricCol), and stacks them.
 *
 * D-FOLD IMAGE SPAN — a D fold's ORIGINAL cells (transRule === 0) come in two
 * horizontally-adjacent columns per row; in the final editor that pair is one
 * image. markDSpans flags the LEFT cell of each pair `spanRight` and the RIGHT
 * cell `spanned`; the chart draws the left cell at double width and skips the
 * hidden right cell. Pairing is per-fold inside a single TU box, so a span can
 * never cross a TU boundary or fuse two folds that share an Fid across TUs, and
 * the row's total width is preserved (keeping the seam/T overlay aligned).
 *
 * The stitch-operation vocabulary lives in STITCH_LIB (§3b) and the H/V/D value
 * tables below reference its entries by key.
 * -------------------------------------------------------------------------*/

/* H-class value: keyed on the row inside the (expanded) fold and belowF. */
function hValueN(cell) {
  const hv = cell.FType === 2;
  if (cell.localRowNotat === 1) {
    const t = {
      null:     ['Trans_A_2_B_2Loops', 'Trans_B_2_A_2Loops'],
      vm:       ['Trans_A_2_B_1Loop', 'Knit_A'],
      vv:       ['Purl_B',             'Trans_B_2_A_1Loop'],
      dm_bl2tr: ['Cast_B_Trans_A_2_B', 'Cast_B_Trans_B_2_A'],
      dm_br2tl: ['Cast_B_Trans_A_2_B', 'Cast_B_Trans_B_2_A'],
      dv_bl2tr: ['Cast_A_Trans_A_2_B', 'Cast_A_Trans_B_2_A'],
      dv_br2tl: ['Cast_A_Trans_A_2_B', 'Cast_A_Trans_B_2_A'],
    }[cell.belowF || 'null'];
    return t[hv ? 1 : 0];
  }
  if (cell.localRowNotat === 2) return hv ? 'Knit_A' : 'Purl_B';
  if (cell.localRowNotat === 3) return hv ? 'Tuck_A' : 'Tuck_B';
  return hv ? 'Tuck_A_Cast_B' : 'Cast_A_Tuck_B';
}
const vValueN = c => c.localRowNotat === 1 ? (c.FType === 3 ? 'Trans_B_2_A_2Loops' : 'Trans_A_2_B_2Loops') : (c.FType === 3 ? 'Knit_A' : 'Purl_B');
function dValueN(c) {
  if (c.transRule === 0) { if (c.FType === 5) return c.FDirect === 'BL2TR' ? 'Twist_Right_A' : 'Twist_Left_A'; return c.FDirect === 'BL2TR' ? 'Twist_Right_B' : 'Twist_Left_B'; }
  if (c.transRule === 1) return c.FType === 5 ? 'Trans_B_2_A_2Loops' : 'Trans_A_2_B_2Loops';
  if (c.transRule === 2) return c.FType === 5 ? 'Knit_A_Cast_B' : 'Cast_A_Purl_B';
  return 'Full_Needle';
}

/* Row builders for the non-TU strips. */
function makeRow(cols, proto) { const a = []; for (let c = 0; c < cols; c++) a.push({ ...proto }); return a; }
function makePlainRow(cols) { return makeRow(cols, { Fid: null, FType: 8, foldClass: 'P', valNotat: 'Full_Needle' }); }
function fillerCell() { return { Fid: null, FType: null, foldClass: null, valNotat: 'No_Stitch' }; }

/* Span function for D-fold ORIGINAL cells (transRule === 0). Each grid row of a
 * D fold owns exactly two adjacent columns that resolve to a single image in
 * the final editor. Per row, we group those cells by Fid and flag the left one
 * `spanRight` (drawn double-width) and the right one `spanned` (skipped). Done
 * per-fold within a single TU box: pairs cannot cross a TU boundary, and two
 * folds sharing an Fid across TUs can never be fused (different translateTUBox
 * calls, separate `exp` grids). */
function markDSpans(exp, R, COLS) {
  for (let ri = 0; ri < R; ri++) {
    const byFid = {};
    for (let ci = 0; ci < COLS; ci++) {
      const c = exp[ri][ci];
      if (c.foldClass === 'D' && c.transRule === 0 && c.Fid != null)
        (byFid[c.Fid] = byFid[c.Fid] || []).push(ci);
    }
    Object.values(byFid).forEach(cis => {
      if (cis.length !== 2) return;               // guard: only clean pairs span
      cis.sort((a, b) => a - b);
      exp[ri][cis[0]].spanRight = true;           // LEFT cell owns the image
      exp[ri][cis[1]].spanned = true;             // RIGHT cell is hidden
    });
  }
}

/* One TU box → expanded notation sub-grid (bottom→top). */
function translateTUBox(build) {
  const COLS = build.boxWidth, BR = build.boxHeight;
  const P = () => ({ Fid: null, FType: 8, foldClass: 'P', FDirect: null, FSlope: null, transRule: null, oLR: null });

  const base = Array.from({ length: BR }, () => Array.from({ length: COLS }, P));
  const set = (c, r, d) => { if (r < 1 || r > BR || c < 1 || c > COLS) return; Object.assign(base[r - 1][c - 1], d); };
  build.folds.forEach(f => f.cells(f.FColStart, f.FRowStart).forEach(({ gridCol, gridRow }) =>
    set(gridCol, gridRow, { Fid: f.Fid, FType: f.FType, foldClass: f.foldClass, FDirect: f.FDirect ?? null, FSlope: f.FSlope ?? null, transRule: f.foldClass === 'D' ? 0 : null, oLR: gridRow - f.FRowStart + 1 })));

  /* Row-insertion expansion (keyed by boundary → auto-collapse on assemble). */
  const ins = {};
  const insRow = b => (ins[b] = ins[b] || Array.from({ length: COLS }, P));
  const wIns = (b, c, d) => { if (c < 1 || c > COLS) return; Object.assign(insRow(b)[c - 1], d); };

  build.folds.forEach(f => {
    const W = f.width;
    if (f.foldClass === 'H') {
      for (let c = f.FColStart; c <= f.FColStart + W - 1; c++)
        wIns(f.FRowStart + 1, c, { Fid: f.Fid, FType: f.FType, foldClass: 'H', FDirect: null, transRule: null, oLR: 'ins' });
    }
    if (f.foldClass === 'D') {
      const botCols = f.FDirect === 'BL2TR' ? [f.FColStart, f.FColStart + 1] : [f.FColStart + W - 2, f.FColStart + W - 1];
      botCols.forEach(c => wIns(f.FRowStart - 1, c, { Fid: f.Fid, FType: f.FType, foldClass: 'D', FDirect: f.FDirect, transRule: 1, oLR: 'insB' }));
      const topRow = f.FRowStart + f.height - 1;
      const topCols = f.FDirect === 'BL2TR' ? [f.FColStart + W - 2, f.FColStart + W - 1] : [f.FColStart];
      const aboveIsH = topCols.some(c => { const a = base[topRow]?.[c - 1]; return a && (a.FType === 1 || a.FType === 2); });
      if (!aboveIsH) topCols.forEach(c => wIns(topRow, c, { Fid: f.Fid, FType: f.FType, foldClass: 'D', FDirect: f.FDirect, transRule: 2, oLR: 'insT' }));
    }
  });

  const exp = [];
  if (ins[0]) exp.push(ins[0]);
  for (let b = 1; b <= BR; b++) { exp.push(base[b - 1]); if (ins[b]) exp.push(ins[b]); }
  const R = exp.length;

  for (let ri = 0; ri < R; ri++) for (let ci = 0; ci < COLS; ci++) exp[ri][ci].belowF = null;

  const byFid = {};
  for (let ri = 0; ri < R; ri++) for (let ci = 0; ci < COLS; ci++) { const c = exp[ri][ci]; if (c.Fid != null) (byFid[c.Fid] = byFid[c.Fid] || []).push({ ri, ci, c }); }
  Object.values(byFid).forEach(list => {
    const mR = Math.min(...list.map(x => x.ri)), mC = Math.min(...list.map(x => x.ci));
    list.forEach(({ ri, ci, c }) => { c.localRowNotat = ri - mR + 1; c.localColNotat = ci - mC + 1; });
  });

  /* H switch — runs BEFORE D side-cells so the cell below an H bottom-row can
   * only be an ORIGINAL D fold cell, never a transRule-2 top side-cell. */
  for (let ri = 0; ri < R; ri++) for (let ci = 0; ci < COLS; ci++) {
    const c = exp[ri][ci];
    if (c.foldClass === 'H' && c.oLR === 1) {
      const bl = ri > 0 ? exp[ri - 1][ci] : null; if (!bl) continue;
      const left = ci > 0 ? exp[ri][ci - 1] : null;
      if (bl.FType === 3) c.belowF = 'vm';
      else if (bl.FType === 4) c.belowF = 'vv';
      else if (bl.FType === 5) c.belowF = bl.FDirect === 'BL2TR' ? 'dm_bl2tr' : (left && left.belowF === 'dm_br2tl' ? c.belowF : 'dm_br2tl');
      else if (bl.FType === 6) c.belowF = bl.FDirect === 'BL2TR' ? 'dv_bl2tr' : (left && left.belowF === 'dv_br2tl' ? c.belowF : 'dv_br2tl');
    }
  }

  const dFolds = build.folds.filter(f => f.foldClass === 'D');
  dFolds.forEach(f => {
    const own = [];
    for (let ri = 0; ri < R; ri++) for (let ci = 0; ci < COLS; ci++) if (exp[ri][ci].Fid === f.Fid) own.push({ ri, ci, c: exp[ri][ci] });
    [...own].sort((a, b) => a.ri - b.ri).forEach(({ ri, ci, c }) => {
      if (c.localRowNotat >= 2) { const bl = ri > 0 ? exp[ri - 1][ci] : null;
        if (bl && bl.FType === 8) Object.assign(bl, { Fid: f.Fid, FType: f.FType, foldClass: 'D', FDirect: f.FDirect, transRule: 1, localRowNotat: c.localRowNotat - 1, localColNotat: c.localColNotat }); }
    });
  });
  dFolds.filter(f => f.FDirect === 'BL2TR').forEach(f => {
    const own = [];
    for (let ri = 0; ri < R; ri++) for (let ci = 0; ci < COLS; ci++) if (exp[ri][ci].Fid === f.Fid) own.push({ ri, ci, c: exp[ri][ci] });
    const maxLRN = Math.max(...own.map(x => x.c.localRowNotat));
    [...own].sort((a, b) => b.ri - a.ri).forEach(({ ri, ci, c }) => {
      if (c.localRowNotat <= maxLRN - 1) { const ab = ri + 1 < R ? exp[ri + 1][ci] : null;
        if (ab && ab.FType === 8) Object.assign(ab, { Fid: f.Fid, FType: f.FType, foldClass: 'D', FDirect: f.FDirect, transRule: 2, localRowNotat: c.localRowNotat + 1, localColNotat: c.localColNotat }); }
    });
  });

  for (let ri = 0; ri < R; ri++) for (let ci = 0; ci < COLS; ci++) {
    const c = exp[ri][ci];
    c.valNotat = c.Fid == null ? 'Full_Needle'
      : c.foldClass === 'H' ? hValueN(c)
      : c.foldClass === 'V' ? vValueN(c)
      : c.foldClass === 'D' ? dValueN(c)
      : 'Full_Needle';
  }

  markDSpans(exp, R, COLS);

  return { grid: exp, cols: COLS, rows: R };
}

/* A TR strip: TUs left→right, heightNotat reconciliation, vertical seams. */
function composeTR(tr) {
  const tuGrids = tr.tus.map(tu => translateTUBox(tu.build()));
  const heightNotat = Math.max(1, ...tuGrids.map(g => g.rows));
  const totalW = tuGrids.reduce((s, g) => s + g.cols, 0);
  const grid = Array.from({ length: heightNotat }, () => Array.from({ length: totalW }, fillerCell));
  const seams = [];
  let colOff = 0;
  tuGrids.forEach((g, idx) => {
    if (idx > 0) seams.push(colOff);
    for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) grid[r][colOff + c] = g.grid[r][c];
    colOff += g.cols;
  });
  seams.forEach(colOff => { for (let r = 0; r < heightNotat; r++) grid[r][colOff].seamLeft = true; });
  return { grid, cols: totalW, rows: heightNotat, seams };
}

/* A TPU-band strip. The 2-row canvas band expands to three notation rows.
 * Stitch values depend on the parity of the band's canvas rowStart:
 *   odd  rowStart → LRN 1: Knit_A, LRN 2: Purl_B, LRN 3: Full_Needle
 *   even rowStart → LRN 1: Purl_B, LRN 2: Knit_A, LRN 3: Full_Needle */
function composeT(startCanvasRow, cols) {
  const odd = (startCanvasRow % 2) === 1;
  const valByLRN = odd
    ? ['Knit_A', 'Purl_B', 'Full_Needle']
    : ['Purl_B', 'Knit_A', 'Full_Needle'];
  const out = [];
  for (let lrn = 1; lrn <= 3; lrn++)
    out.push(makeRow(cols, { Fid: null, FType: 7, foldClass: 'T', localRowNotat: lrn, valNotat: valByLRN[lrn - 1] }));
  return out;
}

/* Toggle guard: every TU in exactly one TR (no sharing, no orphans); all valid. */
function notationGate(model, builtTRs) {
  const ids = Object.keys(model.tus);
  const flat = model.trs.flatMap(t => t.tus).filter(id => model.tus[id]);
  const counts = {};
  flat.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
  if (Object.values(counts).some(n => n > 1)) return { ok: false, reason: 'Some TUs belong to more than one TR (sharing is not allowed).' };
  const assigned = new Set(flat);
  const orphans = ids.filter(id => !assigned.has(id));
  if (orphans.length) return { ok: false, reason: `${orphans.length} placed TU(s) are not grouped into any TR.` };
  const invalid = builtTRs.filter(tr => !tr.isValid(builtTRs));
  if (invalid.length) return { ok: false, reason: 'One or more TRs are currently invalid.' };
  return { ok: true, reason: '' };
}

/* Master build: canvas → gridNotation. */
function buildNotation(model, built, builtTRs) {
  const gate = notationGate(model, builtTRs);
  if (!gate.ok) return { ok: false, reason: gate.reason };

  const rowToTR = new Map();
  const rowToTBand = new Map();
  for (const tr of builtTRs) {
    for (let r = tr.rowMin; r <= tr.rowMax; r++) rowToTR.set(r, tr);
    [tr.rowStart - 1, tr.rowStart, tr.rowMax + 1, tr.rowMax + 2].forEach(r => {
      if (r >= 1 && r <= FabricRow && !rowToTR.has(r)) rowToTBand.set(r, tr);
    });
  }

  /* Decompose the canvas into stacked full-width strips (bottom→top). */
  const strips = [];
  let row = 1;
  while (row <= FabricRow) {
    if (rowToTR.has(row)) {
      const tr = rowToTR.get(row);
      strips.push({ kind: 'TR', tr });
      row = tr.rowMax + 1;
    } else if (rowToTBand.has(row)) {
      const band = rowToTBand.get(row);
      const start = row;
      while (row <= FabricRow && rowToTBand.get(row) === band) row++;
      strips.push({ kind: 'T', rows: row - start, start });
    } else {
      strips.push({ kind: 'P' });
      row++;
    }
  }

  const cols = FabricCol;
  const gridRows = [];
  const seams = [];
  let notaRow = 0;
  for (const s of strips) {
    if (s.kind === 'P') { gridRows.push(makePlainRow(cols)); notaRow += 1; }
    else if (s.kind === 'T') { const t = composeT(s.start, cols); t.forEach(rr => gridRows.push(rr)); notaRow += t.length; }
    else {
      const c = composeTR(s.tr);
      c.seams.forEach(colOff => seams.push({ col: colOff, rowStart: notaRow, rowCount: c.rows }));
      c.grid.forEach(rr => gridRows.push(rr));
      notaRow += c.rows;
    }
  }

  for (let r = 0; r < gridRows.length; r++) {
    const rowArr = gridRows[r];
    for (let c = 0; c < rowArr.length; c++) { rowArr[c].gridRowNotat = r + 1; rowArr[c].gridColNotat = c + 1; }
  }

  return { ok: true, cells: gridRows, cols, rows: gridRows.length, seams };
}

/* Pure derivation of the notation chart's top-layer overlay lines, expressed
 * in GRID UNITS (rows down / cols across, top-origin for display). The View
 * scales these by its cell size — mirroring how computeGeometry emits editor
 * creases in grid units that CanvasArea scales with px()/py().
 *
 *   redLines   — full-width horizontal T-crease band lines. One per band row
 *                (FType===7 && localRowNotat===2), at that row's TOP edge.
 *   blackLines — vertical TU-separation seams, one per notation.seams entry,
 *                spanning the owning TR's display-row range. */
function computeNotationOverlay(notation) {
  if (!notation || !notation.ok) return { redLines: [], blackLines: [] };
  const { cells, cols, rows, seams } = notation;

  const redLines = [];
  for (let ri = 0; ri < rows; ri++) {
    const cell = cells[ri][0];
    if (cell && cell.FType === 7 && cell.localRowNotat === 2) {
      const d = rows - 1 - ri;            // display row index, top→bottom
      redLines.push({ y: d, x1: 0, x2: cols });
    }
  }

  const blackLines = (seams || []).map(s => ({
    x:  s.col,
    y1: rows - s.rowStart - s.rowCount,   // top of TR span
    y2: rows - s.rowStart,                // bottom of TR span
  }));

  return { redLines, blackLines };
}

/* ---------------------------------------------------------------------------
 * §7b.2 · NOTATION SVG EXPORT
 * ---------------------------------------------------------------------------
 * Pure serialization of a gridNotation into a standalone SVG string, mirroring
 * NotationChart's rendering 1:1 (header, gutter, cells incl. the D-fold
 * spanRight/spanned double-width rule, and the top-layer overlay lines via
 * computeNotationOverlay + CREASE_STYLE). No React, no DOM — consumed only by
 * the ToolKit ZIP export (§14e → §7h).
 * -------------------------------------------------------------------------*/
/* Cache loaded stitch artwork so repeated exports do not fetch it again. */
const NOTATION_IMAGE_CACHE = new Map();

/* Blob → self-contained data URL. */
function notationBlobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () =>
      reject(reader.error || new Error('Could not read notation image.'));
    reader.readAsDataURL(blob);
  });
}

/* Load one STITCH_LIB image and convert it to an embedded data URL. */
async function notationImageDataURL(src) {
  if (!src) return null;

  if (!NOTATION_IMAGE_CACHE.has(src)) {
    const job = fetch(src)
      .then(response => {
        if (!response.ok) {
          throw new Error(
            `Could not load stitch image "${src}" (${response.status}).`
          );
        }
        return response.blob();
      })
      .then(notationBlobToDataURL);

    NOTATION_IMAGE_CACHE.set(src, job);
  }

  try {
    return await NOTATION_IMAGE_CACHE.get(src);
  } catch (err) {
    /* Permit a later export attempt to retry the failed asset. */
    NOTATION_IMAGE_CACHE.delete(src);
    throw err;
  }
}

/* ---------------------------------------------------------------------------
 * §7b.2 · NOTATION SVG EXPORT
 * ---------------------------------------------------------------------------
 * Async because all stitch artwork is loaded and embedded directly into the
 * exported SVG. The resulting file is self-contained and does not depend on
 * the application's ./images directory after download.
 * -------------------------------------------------------------------------*/
async function notationToSVG(notation) {
  if (!notation || !notation.ok) return null;

  const { cells, cols, rows } = notation;
  const cw = NOTA_CELL, gut = NOTA_GUT, head = NOTA_HEAD;
  const W = gut + cols * cw;
  const H = head + rows * cw;

  const esc = (s) => String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  /* Find only the stitch images actually used by this chart. */
  const usedImageSources = new Set();

  for (const row of cells) {
    for (const cell of row) {
      if (cell.spanned) continue;

      const lib =
        STITCH_LIB[cell.valNotat] || STITCH_LIB.Full_Needle;

      if (lib.img) usedImageSources.add(lib.img);
    }
  }

  /* Load and embed each distinct image once. */
  const imageData = new Map();

  await Promise.all(
    [...usedImageSources].map(async src => {
      imageData.set(src, await notationImageDataURL(src));
    })
  );

  const p = [];

  p.push(
    `<svg xmlns="http://www.w3.org/2000/svg" ` +
    `width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ` +
    `font-family="Inter, ui-sans-serif, system-ui, sans-serif">`
  );

  p.push(`<rect width="${W}" height="${H}" fill="#ffffff"/>`);

  /* Header and gutter backgrounds. */
  p.push(
    `<rect x="0" y="0" width="${W}" height="${head}" fill="#f1f5f9"/>`
  );
  p.push(
    `<rect x="0" y="${head}" width="${gut}" ` +
    `height="${rows * cw}" fill="#f1f5f9"/>`
  );

  /* Column numbers. */
  for (let c = 0; c < cols; c++) {
    p.push(
      `<text ` +
      `x="${gut + c * cw + cw / 2}" ` +
      `y="${head / 2}" ` +
      `text-anchor="middle" ` +
      `dominant-baseline="central" ` +
      `font-size="9" fill="#94a3b8">` +
      `${c + 1}</text>`
    );
  }

  /* Row numbers, bottom-origin like the UI. */
  for (let ri = rows - 1; ri >= 0; ri--) {
    const y = head + (rows - 1 - ri) * cw;

    p.push(
      `<text ` +
      `x="${gut / 2}" ` +
      `y="${y + cw / 2}" ` +
      `text-anchor="middle" ` +
      `dominant-baseline="central" ` +
      `font-size="9" fill="#94a3b8">` +
      `${ri + 1}</text>`
    );
  }

  p.push(
    `<line x1="0" y1="${head}" x2="${W}" y2="${head}" ` +
    `stroke="#cbd5e1" stroke-width="1"/>`
  );

  p.push(
    `<line x1="${gut}" y1="0" x2="${gut}" y2="${H}" ` +
    `stroke="#cbd5e1" stroke-width="1"/>`
  );

  /* Cells: top-to-bottom display order.
   *
   * `spanned` cells are skipped.
   * `spanRight` cells receive double width, including their stitch image.
   */
  for (let ri = rows - 1; ri >= 0; ri--) {
    const y = head + (rows - 1 - ri) * cw;
    let x = gut;

    for (let ci = 0; ci < cells[ri].length; ci++) {
      const cell = cells[ri][ci];

      if (cell.spanned) continue;

      const w = cell.spanRight ? cw * 2 : cw;
      const lib =
        STITCH_LIB[cell.valNotat] || STITCH_LIB.Full_Needle;

      /* Cell background and grid border. */
      p.push(
        `<rect ` +
        `x="${x}" y="${y}" ` +
        `width="${w}" height="${cw}" ` +
        `fill="${lib.bg}" ` +
        `stroke="#f1f5f9" stroke-width="1"/>`
      );

      if (lib.img) {
        const href = imageData.get(lib.img);

        if (!href) {
          throw new Error(
            `No embedded image data was generated for "${lib.img}".`
          );
        }

        /* Equivalent to the UI's:
         * width: 100%, height: 100%, objectFit: contain.
         */
        p.push(
          `<image ` +
          `x="${x}" y="${y}" ` +
          `width="${w}" height="${cw}" ` +
          `href="${esc(href)}" ` +
          `preserveAspectRatio="xMidYMid meet"/>`
        );
      } else if (lib.code) {
        /* Text fallback only for records without image artwork. */
        p.push(
          `<text ` +
          `x="${x + w / 2}" ` +
          `y="${y + cw / 2}" ` +
          `text-anchor="middle" ` +
          `dominant-baseline="central" ` +
          `font-size="9" font-weight="600" ` +
          `fill="${lib.tx}">` +
          `${esc(lib.code)}</text>`
        );
      }

      x += w;
    }
  }

  /* Top-layer seam and TPU overlays. */
  const { redLines, blackLines } =
    computeNotationOverlay(notation);

  const seamSt = CREASE_STYLE.seam;
  const tpuSt = CREASE_STYLE.tpu;

  blackLines.forEach(l => {
    p.push(
      `<line ` +
      `x1="${gut + l.x * cw}" ` +
      `y1="${head + l.y1 * cw}" ` +
      `x2="${gut + l.x * cw}" ` +
      `y2="${head + l.y2 * cw}" ` +
      `stroke="${seamSt.color}" ` +
      `stroke-width="${seamSt.strokeWidth}"/>`
    );
  });

  redLines.forEach(l => {
    p.push(
      `<line ` +
      `x1="${gut + l.x1 * cw}" ` +
      `y1="${head + l.y * cw}" ` +
      `x2="${gut + l.x2 * cw}" ` +
      `y2="${head + l.y * cw}" ` +
      `stroke="${tpuSt.color}" ` +
      `stroke-width="${tpuSt.strokeWidth}"/>`
    );
  });

  p.push('</svg>');

  return p.join('');
}


/* ---------------------------------------------------------------------------
 * §7c · FOLD BUILDER  (Model — INTERNAL ONLY, nothing is exported to the user)
 * ---------------------------------------------------------------------------
 * v3 — TU-ISLAND MODEL. Grey vertical seams between TUs in a TR are BREAKING
 * LINES: adjacent TUs are NOT connected by their left/right edges. Every TU
 * is a mesh island joined to the canvas exclusively through its top and
 * bottom TUBox edges. Vertices on a breaking line are duplicated, one per
 * side (left TU's copy ordered first). Consequently the planar arrangement
 * and face extraction run PER TU, then per-TU meshes are merged into the
 * global mesh with a weld rule that only welds on shared horizontal lines
 * (TR boundaries + canvas rim rows).
 *
 * SEAM ENDPOINTS: TUBox corners on a TR boundary are shared (single vertex)
 * — the slit is open along its interior and pinched at its ends, where the
 * fabric is continuous through the inter-TR band. (Duplicating them too
 * would force zero-length edges in the band polygon.)
 *
 * ORDER CONVENTIONS (per spec):
 *   vertices — bottom→top, then left→right; coincident duplicates ordered
 *              left-TU first. z = 0 everywhere.
 *   faces    — TR1..TRn; within a TR by TUid; within a TU by bottom-left-most
 *              vertex (bottom first, then left); each face CCW starting at
 *              its bottom-left-most vertex; then inter-TR/margin band
 *              rectangles, bottom→top.
 *   edges    — in face order, CCW within each face, each undirected edge
 *              recorded once at first encounter, oriented as first traversed.
 *
 * ASSIGNMENTS:
 *   M — solid black crease lines           V — dashed black crease lines
 *   V — TUBox top/bottom edges             F — TU3's dashed-side TUBox edge
 *   B — everything else (canvas rim, breaking lines, band sides).
 *   TPU creases emit no edges. There is no 'U' anymore.
 *
 * FACE DATA:
 *   faces_textureRegion — 'TRn' inside TRs, false outside.
 *   faces_compliance    — true for TU4–TU7 side triangles (faces owning an
 *                         edge on the TUBox's left or right edge), else false.
 * -------------------------------------------------------------------------*/

/* Gate: every TU in exactly one TR, all TRs valid — the same predicate as
 * notationGate; an empty canvas previews as a plain, crease-free sheet. */
function foldGate(model, builtTRs) {
  const ids = Object.keys(model.tus);
  const flat = model.trs.flatMap(t => t.tus).filter(id => model.tus[id]);
  const counts = {};
  flat.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
  if (Object.values(counts).some(n => n > 1)) return { ok: false, reason: 'Some TUs belong to more than one TR (sharing is not allowed).' };
  const assigned = new Set(flat);
  const orphans = ids.filter(id => !assigned.has(id));
  if (orphans.length) return { ok: false, reason: `${orphans.length} placed TU(s) are not grouped into any TR.` };
  const invalid = builtTRs.filter(tr => !tr.isValid(builtTRs));
  if (invalid.length) return { ok: false, reason: 'One or more TRs are currently invalid.' };
  return { ok: true, reason: '' };
}

const FB_EPS = 1e-7;
const FB_RANK = { B: 0, V: 1, M: 1, F: 2 };   /* dedupe priority on coincident geometry */

/* ---- §7c.1 · planar arrangement (runs PER TU) ---------------------------- */
function fbArrange(segs) {
  const n = segs.length;
  const cuts = segs.map(() => [0, 1]);

  const paramOn = (s, x, y) => {
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const L2 = dx * dx + dy * dy;
    if (L2 < FB_EPS) return null;
    const t = ((x - s.x1) * dx + (y - s.y1) * dy) / L2;
    if (t < -FB_EPS || t > 1 + FB_EPS) return null;
    if (Math.abs(s.x1 + dx * t - x) > 1e-6 || Math.abs(s.y1 + dy * t - y) > 1e-6) return null;
    return clampN(t, 0, 1);
  };

  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const A = segs[i], B = segs[j];
    const rx = A.x2 - A.x1, ry = A.y2 - A.y1, sx = B.x2 - B.x1, sy = B.y2 - B.y1;
    const den = rx * sy - ry * sx;
    if (Math.abs(den) > FB_EPS) {
      const qpx = B.x1 - A.x1, qpy = B.y1 - A.y1;
      const t = (qpx * sy - qpy * sx) / den;
      const u = (qpx * ry - qpy * rx) / den;
      if (t > -FB_EPS && t < 1 + FB_EPS && u > -FB_EPS && u < 1 + FB_EPS) {
        cuts[i].push(clampN(t, 0, 1));
        cuts[j].push(clampN(u, 0, 1));
      }
    } else {
      const t1 = paramOn(A, B.x1, B.y1); if (t1 !== null) cuts[i].push(t1);
      const t2 = paramOn(A, B.x2, B.y2); if (t2 !== null) cuts[i].push(t2);
      const u1 = paramOn(B, A.x1, A.y1); if (u1 !== null) cuts[j].push(u1);
      const u2 = paramOn(B, A.x2, A.y2); if (u2 !== null) cuts[j].push(u2);
    }
  }

  const verts = [], vmap = new Map();
  const vid = (x, y) => {
    const k = x.toFixed(5) + '_' + y.toFixed(5);
    if (vmap.has(k)) return vmap.get(k);
    vmap.set(k, verts.length); verts.push([x, y]);
    return verts.length - 1;
  };

  const emap = new Map();
  segs.forEach((s, i) => {
    const ts = [...new Set(cuts[i].map(t => +t.toFixed(7)))].sort((a, b) => a - b);
    for (let k = 0; k + 1 < ts.length; k++) {
      const a = vid(s.x1 + (s.x2 - s.x1) * ts[k],     s.y1 + (s.y2 - s.y1) * ts[k]);
      const b = vid(s.x1 + (s.x2 - s.x1) * ts[k + 1], s.y1 + (s.y2 - s.y1) * ts[k + 1]);
      if (a === b) continue;
      const ek = a < b ? a + '_' + b : b + '_' + a;
      const prev = emap.get(ek);
      if (prev === undefined || FB_RANK[s.a] > FB_RANK[prev]) emap.set(ek, s.a);
    }
  });

  let edges = [...emap.entries()].map(([k, a]) => {
    const [i, j] = k.split('_').map(Number);
    return { i, j, a };
  });

  /* prune dangling degree-1 chains (unsnapped stubs) */
  for (;;) {
    const deg = new Map();
    edges.forEach(e => { deg.set(e.i, (deg.get(e.i) || 0) + 1); deg.set(e.j, (deg.get(e.j) || 0) + 1); });
    const keep = edges.filter(e => deg.get(e.i) > 1 && deg.get(e.j) > 1);
    if (keep.length === edges.length) break;
    edges = keep;
  }
  return { verts, edges };
}

/* ---- §7c.2 · face extraction (half-edge walk, CCW faces kept) ------------ */
function fbFaces(verts, edges) {
  const he = [];
  edges.forEach(e => {
    he.push({ from: e.i, to: e.j, twin: he.length + 1 });
    he.push({ from: e.j, to: e.i, twin: he.length - 1 });
  });
  const outMap = new Map();
  he.forEach((h, hi) => {
    if (!outMap.has(h.from)) outMap.set(h.from, []);
    outMap.get(h.from).push(hi);
  });
  const ang = hi => {
    const h = he[hi];
    return Math.atan2(verts[h.to][1] - verts[h.from][1], verts[h.to][0] - verts[h.from][0]);
  };
  const pos = new Map();
  outMap.forEach(list => {
    list.sort((a, b) => ang(a) - ang(b));
    list.forEach((hi, idx) => pos.set(hi, idx));
  });
  const next = hi => {
    const t = he[hi].twin;
    const list = outMap.get(he[t].from);
    return list[(pos.get(t) - 1 + list.length) % list.length];
  };
  const faces = [];
  const seen = new Uint8Array(he.length);
  for (let s = 0; s < he.length; s++) {
    if (seen[s]) continue;
    const cyc = [];
    let cur = s, guard = 0;
    while (!seen[cur] && guard++ <= he.length) { seen[cur] = 1; cyc.push(he[cur].from); cur = next(cur); }
    let A2 = 0;
    for (let k = 0; k < cyc.length; k++) {
      const p = verts[cyc[k]], q = verts[cyc[(k + 1) % cyc.length]];
      A2 += p[0] * q[1] - q[0] * p[1];
    }
    if (A2 > FB_EPS && cyc.length >= 3) faces.push(cyc);
  }
  return faces;
}

/* ---- §7c.3 · master build: canvas → in-memory FOLD object ---------------- */
function buildFold(model, built, builtTRs) {
  const gate = foldGate(model, builtTRs);
  if (!gate.ok) return { ok: false, reason: gate.reason };

  const W = FabricCol, H = FabricRow;
  const geom = computeGeometry(model.tus, built, builtTRs);
  const creases = geom.creases.filter(c =>
    c.role !== CREASE_ROLE.TPU && c.role !== CREASE_ROLE.BOUNDARY);

  /* face/TU processing order: TRid ascending; band spans: rowStart ascending */
  const trsById  = [...builtTRs].sort((a, b) => a.TRid - b.TRid);
  const trsByRow = [...builtTRs].sort((a, b) => a.rowStart - b.rowStart);

  /* shared horizontal lines: only there do meshes weld across owners */
  const sharedYs = [0, H];
  builtTRs.forEach(t => sharedYs.push(t.rowStart, t.rowStart + t.height));
  const isSharedY = y => sharedYs.some(b => Math.abs(y - b) < 1e-6);

  /* union of split-x positions per shared line, so TUBox top/bottom edges,
   * neighbouring TRs (zero-gap case) and band borders all subdivide alike */
  const lineXs = new Map();
  const addX = (y, x) => {
    if (!isSharedY(y)) return;
    const k = y.toFixed(5);
    if (!lineXs.has(k)) lineXs.set(k, new Set());
    lineXs.get(k).add(+x.toFixed(5));
  };
  sharedYs.forEach(y => { addX(y, 0); addX(y, W); });
  creases.forEach(c => { addX(c.p1.y, c.p1.x); addX(c.p2.y, c.p2.x); });

  /* TU boxes (§2 model fields: colStart, width, FType; TU spans its TR's height) */
  const tuBoxes = [];
  trsById.forEach(tr => {
    const y0 = tr.rowStart, y1 = tr.rowStart + tr.height;
    tr.tus.forEach((tu, idx) => {                /* tr.tus holds PlacedTU objects, TUid order */
      const b = tr._builds[idx];
      tuBoxes.push({
        id: tu.id,
        type: parseInt(tu.type.slice(2), 10),    /* 'TU3' -> 3 */
        align: tu.params.spikeAlignment,         /* undefined for TU1–TU3; 2 = middle */
        x0: tu.colStart,
        x1: tu.colStart + b.boxWidth,
        y0, y1, trId: tr.TRid,
      });
    });
    tuBoxes.filter(b => b.trId === tr.TRid).forEach(b => {
      addX(y0, b.x0); addX(y0, b.x1); addX(y1, b.x0); addX(y1, b.x1);
    });
  });

  const xsOn = (y, xa, xb) => {
    const s = lineXs.get(y.toFixed(5));
    const inner = s ? [...s].filter(x => x > xa + FB_EPS && x < xb - FB_EPS) : [];
    return inner.concat([xa, xb]).sort((a, b) => a - b);
  };

  function inBox(c, b) {
    const mx = (c.p1.x + c.p2.x) / 2, my = (c.p1.y + c.p2.y) / 2;
    return mx > b.x0 - FB_EPS && mx < b.x1 + FB_EPS &&
           my > b.y0 + FB_EPS && my < b.y1 - FB_EPS;
  }

  /* global vertex pool — weld by coordinates ONLY on shared lines; everywhere
   * else the key carries the owning TU, which is what duplicates breaking-line
   * vertices per side. `ox` (owner box x0) orders coincident duplicates
   * left-TU-first in the final sort. */
  const gV = [], gMap = new Map();
  const gvid = (x, y, ownerKey, ox) => {
    const key = (isSharedY(y) ? 'S' : 'P' + ownerKey) + '|' + x.toFixed(5) + '|' + y.toFixed(5);
    if (gMap.has(key)) return gMap.get(key);
    gMap.set(key, gV.length);
    gV.push({ x, y, ox });
    return gV.length - 1;
  };

  const edgeA = new Map();
  const setA = (i, j, a) => {
    const k = i < j ? i + '_' + j : j + '_' + i;
    const p = edgeA.get(k);
    if (p === undefined || FB_RANK[a] > FB_RANK[p]) edgeA.set(k, a);
  };

  const faceRecs = [];

  /* ---- per-TU island meshes ---- */
  tuBoxes.forEach(box => {
    const segs = [];

    /* TUBox top/bottom → V; TU3's dashed-side edge → F */
    let aBot = 'V', aTop = 'V';
    if (box.type === 3) {
      const d = creases.find(c => c.dashed && inBox(c, box));
      if (d) {
        const my = (d.p1.y + d.p2.y) / 2;
        if (my - box.y0 < box.y1 - my) aBot = 'F'; else aTop = 'F';
      }
    }
    const emitRow = (y, a) => {
      const xs = xsOn(y, box.x0, box.x1);
      for (let i = 0; i + 1 < xs.length; i++)
        segs.push({ x1: xs[i], y1: y, x2: xs[i + 1], y2: y, a });
    };
    emitRow(box.y0, aBot);
    emitRow(box.y1, aTop);

    /* TUBox left/right → B (the breaking lines / canvas sides) */
    segs.push({ x1: box.x0, y1: box.y0, x2: box.x0, y2: box.y1, a: 'B' });
    segs.push({ x1: box.x1, y1: box.y0, x2: box.x1, y2: box.y1, a: 'B' });

    /* interior creases: solid → M, dashed → V (geometry from computeGeometry,
     * so D-endpoint snapping / V-centerline merging match the editor) */
    creases.forEach(c => {
      if (inBox(c, box))
        segs.push({ x1: c.p1.x, y1: c.p1.y, x2: c.p2.x, y2: c.p2.y, a: c.dashed ? 'V' : 'M' });
    });

    const { verts, edges } = fbArrange(segs);
    const faces = fbFaces(verts, edges);

    const g = verts.map(v => gvid(v[0], v[1], box.id, box.x0));
    edges.forEach(e => setA(g[e.i], g[e.j], e.a));

    /* rotate each face to start at its bottom-left-most vertex; order faces
     * bottom→top then left→right by that anchor */
    const anchor = f => {
      let b = 0;
      f.forEach((vi, k) => {
        const p = verts[vi], q = verts[f[b]];
        if (p[1] < q[1] - FB_EPS || (Math.abs(p[1] - q[1]) < FB_EPS && p[0] < q[0] - FB_EPS)) b = k;
      });
      return b;
    };
    const ordered = faces
      .map(f => { const b = anchor(f); return f.slice(b).concat(f.slice(0, b)); })
      .sort((f1, f2) => (verts[f1[0]][1] - verts[f2[0]][1]) || (verts[f1[0]][0] - verts[f2[0]][0]));

    /* compliance: TU4–TU7 gusset triangles. A gusset exists on a TUBox side
     * only where fabric continues past the spike — i.e. any side the spike
     * is NOT aligned to. On the aligned side the spike is cut by the box
     * edge, so diagonal faces touching THAT side are the main half-spike
     * faces and must stay rigid. Middle alignment admits both sides. The
     * diagonal-edge test still filters out TU6/TU7's rectangular beam walls. */
    const compliant = f => {
      if (box.type < 4) return false;
      const sides = [];
      if (box.align !== -1) sides.push(box.x0);   /* left edge is a gusset side unless left-aligned  */
      if (box.align !==  1) sides.push(box.x1);   /* right edge is a gusset side unless right-aligned */
      let onGussetSide = false, hasDiag = false;
      for (let k = 0; k < f.length; k++) {
        const p = verts[f[k]], q = verts[f[(k + 1) % f.length]];
        for (const s of sides)
          if (Math.abs(p[0] - s) < 1e-6 && Math.abs(q[0] - s) < 1e-6) onGussetSide = true;
        if (Math.abs(p[0] - q[0]) > 1e-6 && Math.abs(p[1] - q[1]) > 1e-6) hasDiag = true;
      }
      return onGussetSide && hasDiag;
    };

    ordered.forEach(f => faceRecs.push({
      vs: f.map(vi => g[vi]),
      region: 'TR' + box.trId,
      comp: compliant(f),
    }));
  });

  /* ---- inter-TR bands and canvas margins (bottom→top) ---- */
  let prev = 0;
  const bands = [];
  trsByRow.forEach(t => {
    if (t.rowStart - prev > 1e-6) bands.push([prev, t.rowStart]);
    prev = t.rowStart + t.height;
  });
  if (H - prev > 1e-6) bands.push([prev, H]);

  bands.forEach(([b0, b1]) => {
    gvid(0, b0, 'band', -1); gvid(W, b0, 'band', -1);
    gvid(0, b1, 'band', -1); gvid(W, b1, 'band', -1);
    const row = y => gV.map((v, i) => ({ v, i }))
      .filter(o => Math.abs(o.v.y - y) < 1e-6)
      .sort((a, b) => a.v.x - b.v.x)
      .map(o => o.i);
    const poly = row(b0).concat(row(b1).reverse());      /* CCW from (0, b0) */
    for (let k = 0; k < poly.length; k++) setA(poly[k], poly[(k + 1) % poly.length], 'B');
    faceRecs.push({ vs: poly, region: false, comp: false });
  });

  if (!faceRecs.length) return { ok: false, reason: 'Crease pattern produced no faces (degenerate arrangement).' };

  /* ---- global vertex renumbering: bottom→top, left→right, left-TU dup first */
  const order = gV.map((_, i) => i).sort((a, b) =>
    (gV[a].y - gV[b].y) || (gV[a].x - gV[b].x) || (gV[a].ox - gV[b].ox));
  const newId = [];
  order.forEach((old, ni) => { newId[old] = ni; });

  const FOLD_ASPECT = CELL_H / CELL_W;   // 16/24 = 2/3
  const vertices_coords = order.map(i => [gV[i].x, gV[i].y * FOLD_ASPECT, 0]);
  const faces_vertices = faceRecs.map(r => r.vs.map(v => newId[v]));

  const edgeA2 = new Map();
  edgeA.forEach((a, k) => {
    const [i, j] = k.split('_').map(Number);
    const ni = newId[i], nj = newId[j];
    edgeA2.set(ni < nj ? ni + '_' + nj : nj + '_' + ni, a);
  });

  /* edges: in face order, CCW within each face, each recorded once */
  const edges_vertices = [], edges_assignment = [];
  const seenE = new Set();
  faces_vertices.forEach(f => {
    for (let k = 0; k < f.length; k++) {
      const i = f[k], j = f[(k + 1) % f.length];
      const kk = i < j ? i + '_' + j : j + '_' + i;
      if (seenE.has(kk)) continue;
      seenE.add(kk);
      edges_vertices.push([i, j]);
      edges_assignment.push(edgeA2.get(kk) || 'B');
    }
  });

  return {
    ok: true,
    file_spec: 1.1,
    file_creator: 'KnitTex',
    frame_title: 'KnitTex canvas',
    frame_unit: 'gridcell',
    vertices_coords,
    edges_vertices,
    edges_assignment,
    faces_vertices,
    faces_textureRegion: faceRecs.map(r => r.region),
    faces_compliance: faceRecs.map(r => r.comp),
  };
}


/* ---------------------------------------------------------------------------
 * §7d · MORPH ENGINE  (Model — pure JS, no React, no THREE, no DOM)
 * ---------------------------------------------------------------------------
 * Verbatim port of the Fabric Morphing Previewer engine. The ONLY changes:
 *   • the engine's module-global `model` became an explicit parameter, so the
 *     module is instantiable and side-effect free;
 *   • a couple of local `key` shadows renamed to `ek`/`pk` for clarity (the
 *     KnitTex Model already exports a global `key(c,r)` helper in §2).
 * v3 (TU-island FOLD format) adjustments:
 *   • faces_textureRegion is now `false` (out of TR) or "TRn"; legacy
 *     true/"plain" still accepted. Internal sentinel remains 'plain'.
 *   • 'U' assignment is gone from the format; the missing-assignment
 *     fallback is now 'B'. F was already handled (F/J panel weld) — for TU3
 *     this welds the dashed-side TU face into the band's rigid panel, and
 *     the plain/textured boundary-pin rule pins that shared edge to the
 *     band's ratchet rank, so the weld is exact under the drive.
 *   • Duplicated breaking-line vertices (one per TU side) need no special
 *     code: they are independent mesh vertices; the rest-state contact
 *     exclusion below automatically excludes coincident duplicates from
 *     self-collision, so open slits can separate freely.
 * v4 (richer jam detection, ported from the reference simulator):
 *   • texStrainCons — measurement-only strain gauges on the edges and
 *     internal triangulation diagonals of RIGID TEXTURED faces. Never
 *     projected (shape matching already enforces rigidity); measured after
 *     each keyframe converges.
 * v5 (watertight contacts, ported from the reference simulator):
 *   • EDGE–EDGE contacts complement the vertex–triangle pass (contactAll =
 *     VT + EE), sharing the spatial-hash scheme, rest-state exclusion, and
 *     zero-weight pinned vertices.
 *   • ANTI-TUNNELING MOTION CLAMP: with contacts on, no free vertex may move
 *     more than 0.45× thickness per iteration (clampStep vs. the m.iterPrev
 *     snapshot, applied BEFORE the contact pass), and contacts run EVERY
 *     iteration as the final op. Keyframe auto-raise governed by the fastest
 *     group at ≤ 0.75× the contact radius per frame.
 * v6 (per-TR drive + per-TR jam detection, ported from the reference):
 *   • GAPS — each textured gap between consecutive plain groups is a drive
 *     unit (m.gaps) owned by its TR token(s); token-less gaps get a pseudo-
 *     token "GAPn". m.trGaps / m.trList expose the token → gap mapping for
 *     the View's TR-selection UI. perTRCapable gates the whole machinery
 *     (non-fallback, 1–31 gaps — masks are bit-packed Int32).
 *   • DRIVE — solveKeyframe now takes a drive object { cum, dy, s }:
 *     rank-carrying pins follow y = y0 − cum[rank] (cum[r] = Σ closures of
 *     active gaps below rank r); with all gaps active this reduces exactly
 *     to the old uniform ratchet. Fallback pins (rank −1) keep y = y0+off·dy.
 *   • FREEZING — vertices whose gap mask touches no active gap are frozen:
 *     flat rest shape rigidly translated by cum of their gap's lower rank,
 *     exempt from gravity and crease bias, zero contact weight but still
 *     solid obstacles (m.frozenList / m.frozenFlag, rebuilt per bake).
 *   • PER-GAP DIAGNOSTICS — faceGapMask / vertGapMask / cEdgeGapMask / the
 *     strain gauges' masks attribute residual penetration and strain to
 *     gaps; cross-TR contacts count toward BOTH. solveKeyframe returns
 *     { pen, strain, penGaps, strainGaps } into the preallocated
 *     m.diagPenGaps / m.diagStrainGaps buffers.
 *   • The EE contact edge list (m.cEdges + m.cEdgeGapMask) is now STATIC,
 *     built in buildEngineModel; buildContactData only builds exclusions.
 *   • m.pinned is now filled per BAKE (pins + frozen verts), no longer at
 *     build time, since the frozen set depends on the TR selection.
 * Behavior — parsing, triangulation, F/J-merged rigid panels via shape
 * matching, M/V crease bias, compliant soft springs, solid-ground z ≥ 0
 * clamp, and the keyframe sweep math — is identical to the reference.
 * -------------------------------------------------------------------------*/
function engEdgeKey(a, b) { return a < b ? a + '_' + b : b + '_' + a; }
function countBits(mk) { let c = 0; while (mk) { c += mk & 1; mk >>>= 1; } return c; }

function triangulatePoly(poly, coords) {
  if (poly.length === 3) return { tris: [poly.slice()], diags: [] };
  const idx = poly.slice();
  const tris = [], diags = [];
  const cross2 = (a, b, p) =>
    (coords[b][0]-coords[a][0])*(coords[p][1]-coords[a][1]) -
    (coords[b][1]-coords[a][1])*(coords[p][0]-coords[a][0]);
  const inTri = (q, a, b, c) => {
    const s1 = cross2(a, b, q), s2 = cross2(b, c, q), s3 = cross2(c, a, q);
    return (s1>1e-9 && s2>1e-9 && s3>1e-9) || (s1<-1e-9 && s2<-1e-9 && s3<-1e-9);
  };
  let A = 0;
  for (let i = 0; i < idx.length; i++) {
    const a = coords[idx[i]], b = coords[idx[(i+1)%idx.length]];
    A += a[0]*b[1] - b[0]*a[1];
  }
  if (A < 0) idx.reverse();
  let guard = 0;
  while (idx.length > 3 && guard++ < 2000) {
    let clipped = false;
    for (let i = 0; i < idx.length; i++) {
      const p = idx[(i-1+idx.length)%idx.length], c = idx[i], n = idx[(i+1)%idx.length];
      if (cross2(p, c, n) <= 1e-12) continue;
      let ok = true;
      for (const q of idx) {
        if (q===p || q===c || q===n) continue;
        if (inTri(q, p, c, n)) { ok = false; break; }
      }
      if (!ok) continue;
      tris.push([p, c, n]); diags.push([p, n]);
      idx.splice(i, 1); clipped = true; break;
    }
    if (!clipped) {
      for (let i = 1; i < idx.length-1; i++) {
        tris.push([idx[0], idx[i], idx[i+1]]);
        if (i < idx.length-2) diags.push([idx[0], idx[i+1]]);
      }
      return { tris, diags };
    }
  }
  tris.push([idx[0], idx[1], idx[2]]);
  return { tris, diags };
}

/* Parse one faces_textureRegion entry (v3 contract):
 *   false            => untextured face (out of any TR)   -> internal 'plain'
 *   "TRn"            => textured face in region n
 * Legacy values still accepted: true => 'TR1', "plain" => 'plain'. */
function parseTextureRegion(v, fi) {
  if (v === false || v === null || v === undefined) return 'plain';
  if (v === true) return 'TR1';
  if (typeof v === 'string') {
    const s = v.trim();
    if (/^plain$/i.test(s)) return 'plain';            /* legacy */
    const mres = /^TR(\d+)$/i.exec(s);
    if (mres) return 'TR' + parseInt(mres[1], 10);
  }
  throw new Error('faces_textureRegion[' + fi + '] = ' + JSON.stringify(v) +
    ' is invalid; expected false or "TRn" (e.g. "TR1", "TR12").');
}

function buildEngineModel(fold) {
  if (!fold.vertices_coords || !fold.edges_vertices || !fold.faces_vertices)
    throw new Error('FOLD file must contain vertices_coords, edges_vertices, faces_vertices.');
  const vc = fold.vertices_coords.map(v => [v[0], v[1], v[2] || 0]);
  const nv = vc.length;
  const faces = fold.faces_vertices;
  const edgesV = fold.edges_vertices;
  const assign = fold.edges_assignment || edgesV.map(() => 'B');  /* v3: no 'U' */

  // ---- Texture regions: false = untexturing face, "TRn" = texturing face. ----
  const texRaw = fold.faces_textureRegion || fold['faces_texturedRegion'] || fold['faces_ftu:textured'];
  let texRegion, texInferred = false;
  if (!texRaw) {
    // Inferred from M/V incidence; inferred textured faces are labeled TR1.
    texInferred = true;
    const mvSet = new Set();
    edgesV.forEach((e, i) => { if (assign[i]==='M' || assign[i]==='V') mvSet.add(engEdgeKey(e[0], e[1])); });
    texRegion = faces.map(f => {
      for (let i = 0; i < f.length; i++)
        if (mvSet.has(engEdgeKey(f[i], f[(i+1)%f.length]))) return 'TR1';
      return 'plain';
    });
  } else {
    if (texRaw.length !== faces.length)
      throw new Error('faces_textureRegion length (' + texRaw.length + ') must match faces_vertices length (' + faces.length + ').');
    texRegion = texRaw.map((v, fi) => parseTextureRegion(v, fi));
  }
  const texFaces = texRegion.map(r => r !== 'plain');
  const regionIds = [...new Set(texRegion.filter(r => r !== 'plain'))]
    .sort((a, b) => parseInt(a.slice(2), 10) - parseInt(b.slice(2), 10));

  // ---- Face compliance: false/absent = rigid, true = compliant ----
  let compliance = fold.faces_compliance || fold.faces_compliant || fold['faces_ftu:compliance'];
  if (!compliance) compliance = faces.map(() => false);
  if (compliance.length !== faces.length)
    throw new Error('faces_compliance length (' + compliance.length + ') must match faces_vertices length (' + faces.length + ').');
  compliance = compliance.map(c => !!c);
  const numCompliant = compliance.filter(c => c).length;

  const tris = [], triFace = [], facetEdges = [];
  const origSet = new Set(edgesV.map(e => engEdgeKey(e[0], e[1])));
  const facetSet = new Set();
  faces.forEach((poly, fi) => {
    const { tris: t, diags } = triangulatePoly(poly, vc);
    t.forEach(tr => { tris.push(tr); triFace.push(fi); });
    diags.forEach(d => {
      const k = engEdgeKey(d[0], d[1]);
      if (!origSet.has(k) && !facetSet.has(k)) { facetSet.add(k); facetEdges.push([d[0], d[1], fi]); }
    });
  });

  const edgeFaces = new Map();
  faces.forEach((f, fi) => {
    for (let i = 0; i < f.length; i++) {
      const ek = engEdgeKey(f[i], f[(i+1)%f.length]);
      if (!edgeFaces.has(ek)) edgeFaces.set(ek, []);
      edgeFaces.get(ek).push(fi);
    }
  });
  const triAdj = new Map();
  tris.forEach((t, ti) => {
    for (let k = 0; k < 3; k++) {
      const ek = engEdgeKey(t[k], t[(k+1)%3]);
      if (!triAdj.has(ek)) triAdj.set(ek, []);
      triAdj.get(ek).push(t[(k+2)%3]);
    }
  });

  const dist = (i, j) => Math.hypot(vc[i][0]-vc[j][0], vc[i][1]-vc[j][1], vc[i][2]-vc[j][2]);

  // ---- Rigid panels: F/J-merged RIGID faces only, enforced by exact shape
  // matching. In v3, F occurs on TU3's dashed-side TUBox edge, welding that
  // textured TU face to the adjacent plain band face — both are rigid, so the
  // union below applies; textured/plain mixing within a panel is fine. ----
  const parent = faces.map((_, i) => i);
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; };
  edgesV.forEach((e, i) => {
    if (assign[i] === 'F' || assign[i] === 'J') {
      const fs = edgeFaces.get(engEdgeKey(e[0], e[1]));
      if (fs && fs.length >= 2 && !compliance[fs[0]] && !compliance[fs[1]]) union(fs[0], fs[1]);
    }
  });
  const panelVertsMap = new Map();
  faces.forEach((f, fi) => {
    if (compliance[fi]) return;
    const r = find(fi);
    if (!panelVertsMap.has(r)) panelVertsMap.set(r, new Set());
    const s = panelVertsMap.get(r);
    f.forEach(v => s.add(v));
  });
  const panels = [];
  panelVertsMap.forEach(set => {
    const verts = [...set];
    const n = verts.length;
    let cx = 0, cy = 0, cz = 0;
    verts.forEach(v => { cx += vc[v][0]; cy += vc[v][1]; cz += vc[v][2]; });
    cx /= n; cy /= n; cz /= n;
    const q = new Float64Array(n * 3);
    verts.forEach((v, k) => { q[k*3] = vc[v][0]-cx; q[k*3+1] = vc[v][1]-cy; q[k*3+2] = vc[v][2]-cz; });
    panels.push({ verts, q, quat: new Float64Array([0,0,0,1]), A: new Float64Array(9), R: new Float64Array(9), warm: false });
  });

  // ---- Length constraints, split by compliance. Breaking-line side edges
  // (B, one face each) land in stiffCons per side — duplicates coexist. ----
  const stiffCons = [], softCons = [];
  edgesV.forEach(e => {
    const fs = edgeFaces.get(engEdgeKey(e[0], e[1])) || [];
    const allSoft = fs.length > 0 && fs.every(fi => compliance[fi]);
    if (allSoft)
      softCons.push({ i: e[0], j: e[1], r: dist(e[0], e[1]), alpha: 0, lam: 0 });
    else
      stiffCons.push({ i: e[0], j: e[1], r: dist(e[0], e[1]) });
  });
  facetEdges.forEach(d => {
    if (compliance[d[2]])
      softCons.push({ i: d[0], j: d[1], r: dist(d[0], d[1]), alpha: 0, lam: 0 });
  });

  // ---- Measurement-only strain gauges for jam detection: edges and internal
  // diagonals of RIGID TEXTURED faces. Never projected (rigidity is already
  // enforced by shape matching); only measured after each keyframe converges.
  // v6: each gauge remembers its owning faces so it can carry a gap mask.
  const texRigid = faces.map((_, fi) => texFaces[fi] && !compliance[fi]);
  const texStrainCons = [];
  edgesV.forEach(e => {
    const fs = edgeFaces.get(engEdgeKey(e[0], e[1])) || [];
    const owners = fs.filter(fi => texRigid[fi]);
    if (owners.length) texStrainCons.push({ i: e[0], j: e[1], r: dist(e[0], e[1]), faces: owners, mask: 0 });
  });
  facetEdges.forEach(d => {
    if (texRigid[d[2]]) texStrainCons.push({ i: d[0], j: d[1], r: dist(d[0], d[1]), faces: [d[2]], mask: 0 });
  });

  const creases = [];
  edgesV.forEach((e, i) => {
    if (assign[i] !== 'M' && assign[i] !== 'V') return;
    const wings = triAdj.get(engEdgeKey(e[0], e[1]));
    if (!wings || wings.length < 2) return;
    creases.push({ u: e[0], v: e[1], wings: [wings[0], wings[1]], dir: assign[i]==='V' ? 1 : -1 });
  });

  // Only rigid plain (untexturing) faces ground their vertices (used by
  // the crease-bias exclusion and gravity's free-vertex list).
  const grounded = new Uint8Array(nv);
  faces.forEach((f, fi) => { if (!texFaces[fi] && !compliance[fi]) f.forEach(v => grounded[v] = 1); });

  // ---- Ratcheted drive: plain-face groups ranked bottom-to-top in y. ----
  // In v3 each inter-TR band is a single face sharing no edges with other
  // bands, so each band is its own group, ranked by y — exactly the drive
  // the TU-island model needs.
  const gParent = faces.map((_, i) => i);
  const gFind = x => { while (gParent[x] !== x) { gParent[x] = gParent[gParent[x]]; x = gParent[x]; } return x; };
  const gUnion = (a, b) => { a = gFind(a); b = gFind(b); if (a !== b) gParent[b] = a; };
  edgeFaces.forEach(fs => {
    const plainFs = fs.filter(fi => !texFaces[fi]);
    for (let i = 1; i < plainFs.length; i++) gUnion(plainFs[0], plainFs[i]);
  });
  const groupMap = new Map();
  faces.forEach((f, fi) => {
    if (texFaces[fi]) return;
    const r = gFind(fi);
    if (!groupMap.has(r)) groupMap.set(r, { faces: [], yMin: Infinity, yMax: -Infinity });
    const g = groupMap.get(r);
    g.faces.push(fi);
    f.forEach(v => { g.yMin = Math.min(g.yMin, vc[v][1]); g.yMax = Math.max(g.yMax, vc[v][1]); });
  });
  const plainGroups = [...groupMap.values()].sort((a, b) => (a.yMin + a.yMax) - (b.yMin + b.yMax));
  const faceRank = faces.map(() => -1);
  plainGroups.forEach((g, r) => { g.rank = r; g.faces.forEach(fi => faceRank[fi] = r); });
  const numGroups = plainGroups.length;

  // ---- Textured gaps between consecutive plain groups (per-TR drive units).
  const gaps = [];
  for (let r = 0; r + 1 < numGroups; r++) {
    gaps.push({ below: r, above: r + 1,
      y0: plainGroups[r].yMax, y1: plainGroups[r + 1].yMin,
      size: plainGroups[r + 1].yMin - plainGroups[r].yMax, trs: new Set() });
  }
  const numGaps = gaps.length;

  // Smallest textured gap between consecutive plain groups: the compression
  // budget is a % of this, so no gap over-closes.
  let minGap = Infinity;
  for (let r = 0; r + 1 < numGroups; r++) {
    const gap = plainGroups[r + 1].yMin - plainGroups[r].yMax;
    if (gap > 1e-9) minGap = Math.min(minGap, gap);
  }

  // ---- Gap-attribution masks (bit g = gap g) for per-TR jam detection. ----
  const faceGapMask = new Int32Array(faces.length);
  if (numGaps > 0 && numGaps <= 31) {
    faces.forEach((f, fi) => {
      if (texFaces[fi]) {
        let cy = 0; f.forEach(v => cy += vc[v][1]); cy /= f.length;
        let best = 0, bd = Infinity;
        for (let gi = 0; gi < numGaps; gi++) {
          const gp = gaps[gi];
          const d = cy < gp.y0 ? gp.y0 - cy : (cy > gp.y1 ? cy - gp.y1 : 0);
          if (d < bd) { bd = d; best = gi; }
        }
        faceGapMask[fi] = 1 << best;
        gaps[best].trs.add(texRegion[fi]);
      } else {
        const r = faceRank[fi];
        let mk = 0;
        if (r > 0) mk |= 1 << (r - 1);
        if (r >= 0 && r < numGaps) mk |= 1 << r;
        faceGapMask[fi] = mk;
      }
    });
  }
  const vertGapMask = new Int32Array(nv);
  faces.forEach((f, fi) => { const mk = faceGapMask[fi]; if (mk) f.forEach(v => vertGapMask[v] |= mk); });

  // Strain-gauge gap masks from their owning rigid-textured faces.
  texStrainCons.forEach(c => { let mk = 0; c.faces.forEach(fi => mk |= faceGapMask[fi]); c.mask = mk; });

  // ---- EE contact edge list (all mesh edges + triangulation diagonals) with
  // gap masks from their adjacent faces. Static per model, so built here.
  const cEdges = [], cEdgeGapMaskArr = [];
  edgesV.forEach(e => {
    const fs = edgeFaces.get(engEdgeKey(e[0], e[1])) || [];
    let mk = 0; fs.forEach(fi => mk |= faceGapMask[fi]);
    cEdges.push([e[0], e[1]]); cEdgeGapMaskArr.push(mk);
  });
  facetEdges.forEach(d => { cEdges.push([d[0], d[1]]); cEdgeGapMaskArr.push(faceGapMask[d[2]]); });
  const cEdgeGapMask = Int32Array.from(cEdgeGapMaskArr);

  // ---- TR token bookkeeping. A gap whose faces carry no TR token still needs
  // to be selectable, so it gets a pseudo-token "GAPn".
  const tokNum = t => { const mm = /(\d+)$/.exec(t); return mm ? parseInt(mm[1], 10) : 0; };
  const tokSort = (a, b) => {
    const at = a.slice(0, 2) === 'TR', bt = b.slice(0, 2) === 'TR';
    return at === bt ? tokNum(a) - tokNum(b) : (at ? -1 : 1);
  };
  const trGaps = new Map();
  gaps.forEach((g, gi) => {
    if (g.trs.size === 0) g.trs.add('GAP' + (gi + 1));
    g.trs = [...g.trs].sort(tokSort);
    g.trs.forEach(t => { if (!trGaps.has(t)) trGaps.set(t, []); trGaps.get(t).push(gi); });
  });
  const trList = [...trGaps.keys()].sort(tokSort);
